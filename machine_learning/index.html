<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f7f8fc">
  <meta name="description" content="An interactive, detailed machine-learning study atlas derived from your lecture notes.">
  <title>Machine Learning Atlas — Learn by understanding</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app-shell" id="app-shell">
    <aside class="sidebar" id="sidebar" aria-label="Course navigation">
      <div class="brand" role="button" tabindex="0" data-go="home" aria-label="Go to home">
        <div class="brand-mark"><svg viewBox="0 0 40 40" fill="none" aria-hidden="true"><circle cx="20" cy="20" r="15" stroke="currentColor" stroke-width="1.5" opacity=".42"/><circle cx="20" cy="20" r="8" stroke="currentColor" stroke-width="2"/><circle cx="20" cy="20" r="2.8" fill="currentColor"/><path d="M20 1v10M39 20H29M20 39V29M1 20h10" stroke="currentColor" stroke-width="2"/></svg></div>
        <div class="brand-text"><strong>ML Atlas<span class="brand-dot">.</span></strong><small>THE STUDY EDITION</small></div>
      </div>
      <div class="sidebar-content">
        <button class="search-trigger" id="search-trigger" type="button"><svg class="icon" viewBox="0 0 24 24" fill="none"><circle cx="11" cy="11" r="6.6" stroke="currentColor" stroke-width="1.8"/><path d="m16 16 4 4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg><span>Search everything</span><kbd>⌘ K</kbd></button>
        <div class="side-section-label">WORKSPACE</div>
        <button class="side-link" data-go="home"><span class="side-ico">▦</span> Overview <span class="side-tail">↗</span></button>
        <button class="side-link" data-go="practice"><span class="side-ico">✦</span> Practice questions <span class="side-counter" id="quiz-side-count">35</span></button>
        <button class="side-link" data-go="bookmarks"><span class="side-ico">☆</span> Bookmarks <span class="side-tail">›</span></button>
        <button class="side-link" data-go="sources"><span class="side-ico">▤</span> Source library <span class="side-tail">›</span></button>
        <div class="side-section-label side-top">YOUR LEARNING PATH <span id="total-chapters"></span></div>
        <div id="module-navigation"></div>
      </div>
      <div class="sidebar-foot"><div class="progress-small"><div class="progress-small-top"><span>Course progress</span><strong id="side-percentage">0%</strong></div><div class="progress-track"><div class="progress-bar" id="side-progress"></div></div></div><p>Understand the idea. Then solve the problem.</p></div>
    </aside>
    <div class="sidebar-backdrop" id="sidebar-backdrop" aria-hidden="true"></div>
    <div class="main-column">
      <header class="topbar"><div class="topbar-left"><button class="icon-button mobile-menu" id="menu-button" aria-label="Open navigation">☰</button><div id="breadcrumbs" class="breadcrumbs"><span>Workspace</span><span class="chev">/</span><b>Overview</b></div></div><div class="topbar-actions"><span class="topbar-status"><i></i> Built from your lectures</span><button class="icon-button" id="theme-toggle" aria-label="Toggle dark mode" title="Toggle appearance">◐</button><button class="topbar-pill" data-go="practice">✧ Practice</button></div></header>
      <main id="view" tabindex="-1"></main>
      <footer class="site-footer"><span>ML ATLAS <span class="foot-sep">/</span> A personal machine learning field guide</span><span>Made to understand, not memorize.</span></footer>
    </div>
  </div>
  <div class="search-overlay" id="search-overlay" hidden><div class="search-dismiss" id="search-dismiss"></div><div class="search-dialog" role="dialog" aria-modal="true" aria-label="Search ML Atlas"><div class="search-dialog-head"><span>⌕</span><input id="global-search" type="search" placeholder="Search topics, formulas, explanations…" autocomplete="off"><kbd>ESC</kbd></div><div id="search-results" class="search-results"></div><div class="search-dialog-foot"><span>↵ Open result</span><span>↑ ↓ Navigate</span><span>Esc Close</span></div></div></div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script src="content.js"></script>
  <script src="visuals.js"></script>
  <script src="app.js"></script>
</body>
</html>

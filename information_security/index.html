Costs / limitations:<\/strong> skilled people are needed, monitoring continues after assessment, and the assessment itself uses time and money. It can also become outdated if systems change.<\/p>\n<p><strong>Source:<\/strong> Risk management, slides 21–27.<\/p>\n<h2>Seven ISO 27001 assessment steps — as taught<\/h2>\n<ol>\n<li>Define the <strong>risk assessment method<\/strong> (scope, scoring, thresholds).<\/li>\n<li>Compile an inventory of <strong>information assets<\/strong>.<\/li>\n<li>Identify <strong>threats and vulnerabilities<\/strong>.<\/li>\n<li><strong>Evaluate risks<\/strong> and choose priorities.<\/li>\n<li><strong>Mitigate / treat<\/strong> selected risks.<\/li>\n<li>Compile <strong>risk reports<\/strong> and decisions.<\/li>\n<li><strong>Review, monitor and audit<\/strong>.<\/li>\n<\/ol>\n<blockquote>\n<p><strong>Useful distinction<\/strong> · <strong>ISO 31000<\/strong> gives general risk-management guidance. <strong>ISO/IEC 27005<\/strong> focuses on information-security risk within an ISMS. <strong>ISO/IEC 27001<\/strong> gives requirements for an information security management system (ISMS). <strong>NIST SP 800-30<\/strong> is risk assessment guidance. <strong>OCTAVE<\/strong> and <strong>FAIR<\/strong> are risk-analysis methods. These are related but not interchangeable.<\/p>\n<\/blockquote>\n<p><strong>Source:<\/strong> Risk management, slides 15–18, 28.<\/p>\n<h2>Data protection and resilience controls<\/h2>\n<table>\n<thead>\n<tr>\n<th>Control<\/th>\n<th>Purpose<\/th>\n<th>Caution<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>Encryption<\/strong><\/td>\n<td>Make data unreadable without appropriate key access.<\/td>\n<td>Needs key management and suitable authentication.<\/td>\n<\/tr>\n<tr>\n<td><strong>Secure erasure<\/strong><\/td>\n<td>Make deleted data difficult to recover.<\/td>\n<td>SSDs may require special secure-erase or cryptographic-erase methods.<\/td>\n<\/tr>\n<tr>\n<td><strong>Data masking<\/strong><\/td>\n<td>Replace sensitive data with realistic-looking values for training/tests.<\/td>\n<td>Masks must not leak original identifiers.<\/td>\n<\/tr>\n<tr>\n<td><strong>Backup<\/strong><\/td>\n<td>Recover after deletion, corruption or outage.<\/td>\n<td>Test restoration and separate backup privileges.<\/td>\n<\/tr>\n<tr>\n<td><strong>RAID<\/strong><\/td>\n<td>Tolerate some storage-device failures.<\/td>\n<td><strong>RAID is not a backup<\/strong>; it cannot undo accidental deletion or ransomware.<\/td>\n<\/tr>\n<tr>\n<td><strong>Standby servers, redundancy, UPS<\/strong><\/td>\n<td>Reduce outage impact.<\/td>\n<td>Need planned failover and testing.<\/td>\n<\/tr>\n<tr>\n<td><strong>IDS / IPS<\/strong><\/td>\n<td>Detect / possibly block network threats.<\/td>\n<td>Needs tuning, updates and monitoring.<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>Source:<\/strong> Risk management, slides 29–30; introductory availability controls.<\/p>\n"},{"num":"11","slug":"governance","title":"Organizational security and governance","short":"Security governance","category":"Management & response","description":"Organizational roles, governance, policies, technical controls, standards and third parties.","sections":5,"minutes":4,"html":"<blockquote>\n<p><strong>Core idea<\/strong> · Security governance means <strong>who makes security decisions, what rules exist, who carries them out, and how the organization knows they work<\/strong>.<\/p>\n<\/blockquote>\n<h2>Governance vs operations<\/h2>\n<p><strong>Information security governance<\/strong> is a framework of policies, practices and strategies that aligns resources with protecting information. The lecture names four <strong>priorities<\/strong>: resource allocation, compliance, accountability and implementation.<\/p>\n<p>It also defines four <strong>components<\/strong>:<\/p>\n<table>\n<thead>\n<tr>\n<th>Component<\/th>\n<th>Plain meaning<\/th>\n<th>Example<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>Strategy<\/strong><\/td>\n<td>Set goals and direction.<\/td>\n<td>Decide sensitive records need strict control.<\/td>\n<\/tr>\n<tr>\n<td><strong>Implementation<\/strong><\/td>\n<td>Put requirements and controls into place.<\/td>\n<td>Enable MFA and access policies.<\/td>\n<\/tr>\n<tr>\n<td><strong>Operation<\/strong><\/td>\n<td>Keep the measures working day-to-day.<\/td>\n<td>Review new accounts and security events.<\/td>\n<\/tr>\n<tr>\n<td><strong>Monitoring<\/strong><\/td>\n<td>Measure and report performance.<\/td>\n<td>Audit permissions and track incidents.<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<blockquote>\n<p><strong>Why governance is not only IT<\/strong> · Management sets priorities and budgets. Security teams design controls. Employees follow policies. Auditors and owners check results. If nobody owns a control, installing software is not enough.<\/p>\n<\/blockquote>\n<p><strong>Source:<\/strong> Organizational security, slides 2–4.<\/p>\n<h2>Four major areas of security policy<\/h2>\n<p>The slides group organizational policies into <strong>organizational security measures<\/strong>, <strong>incident response and business continuity<\/strong>, <strong>human resources<\/strong>, and <strong>technical security measures<\/strong>.<\/p>\n<p>Organizational measures cover <strong>security management<\/strong>, roles/responsibilities, access-control policies, asset management, change management and external data processors.<\/p>\n<p>Technical measures cover <strong>physical and logical access<\/strong>, logging/monitoring, data-at-rest protection, server/database security, endpoint/workstation security and network/communications protection.<\/p>\n<p><strong>Third-party access<\/strong> should use approved accounts, well-defined boundaries, least privilege and clear contracts/policies. Outsourcing a function does not remove the organization's obligation to manage supplier risk.<\/p>\n<p><strong>Source:<\/strong> Organizational security, slides 5–8.<\/p>\n<h2>Policy, standard, procedure and guideline<\/h2>\n<table>\n<thead>\n<tr>\n<th>Document<\/th>\n<th>Meaning<\/th>\n<th>Example<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>Policy<\/strong><\/td>\n<td>A high-level rule stating what must happen and why.<\/td>\n<td>All staff accounts must use MFA.<\/td>\n<\/tr>\n<tr>\n<td><strong>Standard<\/strong><\/td>\n<td>A specific mandatory requirement supporting policy.<\/td>\n<td>Approved authenticator types and configuration criteria.<\/td>\n<\/tr>\n<tr>\n<td><strong>Procedure<\/strong><\/td>\n<td>Step-by-step instructions to carry out a task.<\/td>\n<td>How the IT team registers a new MFA method.<\/td>\n<\/tr>\n<tr>\n<td><strong>Guideline<\/strong><\/td>\n<td>Recommended, not always mandatory, good practice.<\/td>\n<td>Prefer passkeys where supported.<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>The lecture describes <strong>security standards<\/strong> as shared, precise specifications that support consistent design, procurement, and protection. Bodies listed: <strong>ISO<\/strong>, <strong>NIST<\/strong>, <strong>BSI<\/strong>, <strong>IETF<\/strong>, and <strong>PCI SSC<\/strong>.<\/p>\n<p><strong>Source:<\/strong> Organizational security, slides 12–15. Policy/standard/procedure distinctions are added explanation.<\/p>\n<h2>ISO/IEC 17799:2005 domains from the slides<\/h2>\n<p>The historical lecture framework lists control areas:<\/p>\n<ol>\n<li>Security policy; organization of information security; asset management.<\/li>\n<li>Human resources security; physical and environmental security.<\/li>\n<li>Communications and operations management; access control.<\/li>\n<li>Information-system acquisition, development and maintenance.<\/li>\n<li>Information-security incident management; business continuity; compliance.<\/li>\n<\/ol>\n<blockquote>\n<p><strong>Modern context<\/strong> · ISO/IEC <strong>17799:2005<\/strong> is an <strong>older<\/strong> reference used in your lecture. It was superseded by later ISO/IEC 27002 guidance. For exam questions about the slide, learn the listed domains; for a new real-world project, check the current ISO/IEC 27001/27002 editions.<\/p>\n<\/blockquote>\n<p><strong>Source:<\/strong> Organizational security, slides 16–18.<\/p>\n<h2>Example policies for common exam questions<\/h2>\n<p>The lecture asks students to design rules for five areas. Here are <strong>short sample policies<\/strong> that demonstrate the expected structure:<\/p>\n<table>\n<thead>\n<tr>\n<th>Area<\/th>\n<th>Four example rules<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>Password management<\/strong><\/td>\n<td>Use unique secrets; use an approved password manager; require MFA where supported; report suspected exposure immediately.<\/td>\n<\/tr>\n<tr>\n<td><strong>System access<\/strong><\/td>\n<td>Give least privilege; require individual accounts; review rights regularly; remove accounts when no longer needed.<\/td>\n<\/tr>\n<tr>\n<td><strong>Physical areas<\/strong><\/td>\n<td>Require entry authorization; issue visitor badges; escort visitors in restricted rooms; maintain access logs.<\/td>\n<\/tr>\n<tr>\n<td><strong>Remote access<\/strong><\/td>\n<td>Use approved secure remote tools; require MFA; keep devices updated; report lost devices.<\/td>\n<\/tr>\n<tr>\n<td><strong>Internet and email<\/strong><\/td>\n<td>Do not share sensitive data through unapproved channels; verify unusual requests; report suspicious emails; only install approved software.<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>Exam technique:<\/strong> Name a clear rule, who it applies to, and what the organization should do. Rules should be specific enough to assess, not just “make security better.”<\/p>\n<p><strong>Source:<\/strong> Organizational security, slides 19–20. Table examples are newly drafted study examples.<\/p>\n"},{"num":"12","slug":"incidents","title":"Security incident response","short":"Incident response","category":"Management & response","description":"NIST and SANS processes, incident plans, continuity, recovery, teams and RACI.","sections":7,"minutes":4,"html":"<blockquote>\n<p><strong>Core idea<\/strong> · Incident response is an organized process for identifying, containing, resolving and learning from security incidents so that damage is limited and operations can recover.<\/p>\n<\/blockquote>\n<h2>Event, alert or incident?<\/h2>\n<table>\n<thead>\n<tr>\n<th>Term<\/th>\n<th>Meaning<\/th>\n<th>Example<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>Event<\/strong><\/td>\n<td>Something happens in a system.<\/td>\n<td>A login, file deletion, server setting change.<\/td>\n<\/tr>\n<tr>\n<td><strong>Alert<\/strong><\/td>\n<td>A notification raised because of a condition/event.<\/td>\n<td>Several failed logins trigger a warning.<\/td>\n<\/tr>\n<tr>\n<td><strong>Incident<\/strong><\/td>\n<td>A confirmed or strongly suspected security event requiring response under the organization's criteria.<\/td>\n<td>Stolen credentials used to access records.<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>Not every <strong>event<\/strong> is an incident. Not every <strong>alert<\/strong> means an attack occurred. Analysts investigate to decide whether activity is normal or dangerous.<\/p>\n<p><strong>Source:<\/strong> Incident response, slides 2, 8.<\/p>\n<h2>NIST four stages — lecture model<\/h2>\n<div class=\"step-stack\"><div><em>1<\/em><span><strong>Preparation<\/strong> — plans, training, monitoring, backups, contact lists.<\/span><\/div><div><em>2<\/em><span><strong>Detection & analysis<\/strong> — notice suspicious activity, investigate, confirm and assess.<\/span><\/div><div><em>3<\/em><span><strong>Containment, eradication & recovery<\/strong> — limit spread, remove cause, restore and verify operations.<\/span><\/div><div><em>4<\/em><span><strong>Post-incident activity<\/strong> — document, review and improve defenses.<\/span><\/div><\/div>\n<blockquote>\n<p><strong>Source-vs-current note<\/strong> · This is the <strong>older four-phase NIST model used in your slides<\/strong>. NIST released <strong>SP 800-61 Rev. 3 in April 2025<\/strong>, aligned with <strong>CSF 2.0<\/strong> and a revised incident-response lifecycle. For the exam, learn the four lecture phases; for current professional guidance, see <a href=\"https://csrc.nist.gov/pubs/sp/800/61/r3/final\" target=\"_blank\" rel=\"noopener\">NIST SP 800-61 Rev. 3 ↗<\/a>.<\/p>\n<\/blockquote>\n<p><strong>Source:<\/strong> Incident response, slide 3.<\/p>\n<h2>SANS six stages — know P I C E R L<\/h2>\n<div class=\"diagram-flow\"><span>Preparation<\/span><b>→<\/b><span>Identification<\/span><b>→<\/b><span>Containment<\/span><b>→<\/b><span>Eradication<\/span><b>→<\/b><span>Recovery<\/span><b>→<\/b><span>Lessons learned<\/span><\/div>\n<table>\n<thead>\n<tr>\n<th>Stage<\/th>\n<th>Main question<\/th>\n<th>Example<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>Preparation<\/strong><\/td>\n<td>Are we ready?<\/td>\n<td>Plans, tools, backups, response training.<\/td>\n<\/tr>\n<tr>\n<td><strong>Identification<\/strong><\/td>\n<td>Is this a real incident?<\/td>\n<td>Examine unusual logins and alerts.<\/td>\n<\/tr>\n<tr>\n<td><strong>Containment<\/strong><\/td>\n<td>How do we stop it spreading now?<\/td>\n<td>Restrict affected account or network access.<\/td>\n<\/tr>\n<tr>\n<td><strong>Eradication<\/strong><\/td>\n<td>How do we remove the root cause?<\/td>\n<td>Remove malicious software, patch the issue.<\/td>\n<\/tr>\n<tr>\n<td><strong>Recovery<\/strong><\/td>\n<td>How do we safely resume service?<\/td>\n<td>Restore from trusted backups; monitor.<\/td>\n<\/tr>\n<tr>\n<td><strong>Lessons learned<\/strong><\/td>\n<td>What should we change?<\/td>\n<td>Improve playbooks and controls.<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>Containment ≠ eradication:<\/strong> containment limits immediate harm; eradication removes the underlying problem. <strong>Recovery<\/strong> comes after sufficient confidence that systems are safe to restore.<\/p>\n<p><strong>Source:<\/strong> Incident response, slides 4–5.<\/p>\n<h2>Incident Response Plan (IRP) and example<\/h2>\n<p>An <strong>IRP<\/strong> is the documented playbook explaining <strong>what to do, who does it, how to communicate, and how to recover<\/strong>. It includes reporting routes, incident categories, escalation, roles, evidence handling, communications, and review.<\/p>\n<p><strong>Example: a staff email account is compromised after phishing.<\/strong><\/p>\n<ol>\n<li><strong>Report:<\/strong> employee tells security/IT through approved channels.<\/li>\n<li><strong>Identify:<\/strong> analyze unusual login or message activity and determine scope.<\/li>\n<li><strong>Contain:<\/strong> restrict the affected account/session and block related malicious messages.<\/li>\n<li><strong>Eradicate:<\/strong> reset compromised credentials, close unauthorized sessions, and fix the entry point.<\/li>\n<li><strong>Recover:<\/strong> restore access safely, check mail rules and related accounts, monitor.<\/li>\n<li><strong>Communicate and learn:<\/strong> notify relevant people based on impact, update training and controls.<\/li>\n<\/ol>\n<p>The plan should also tell staff how to preserve logs and evidence and when to involve legal or compliance teams.<\/p>\n<p><strong>Source:<\/strong> Incident response, slides 6–7, 14–15.<\/p>\n<h2>Who does what? Incident response team<\/h2>\n<table>\n<thead>\n<tr>\n<th>Role<\/th>\n<th>Main responsibility<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>Incident coordinator<\/strong><\/td>\n<td>Lead response and decisions; communicate with management.<\/td>\n<\/tr>\n<tr>\n<td><strong>Security analyst / investigator<\/strong><\/td>\n<td>Review logs, alerts, scope and cause.<\/td>\n<\/tr>\n<tr>\n<td><strong>Forensic specialist<\/strong><\/td>\n<td>Preserve and analyze evidence.<\/td>\n<\/tr>\n<tr>\n<td><strong>System/network administrator<\/strong><\/td>\n<td>Isolate, patch, restore and reconfigure systems.<\/td>\n<\/tr>\n<tr>\n<td><strong>Communications / PR<\/strong><\/td>\n<td>Internal/external messaging and updates.<\/td>\n<\/tr>\n<tr>\n<td><strong>Legal/compliance officer<\/strong><\/td>\n<td>Legal duties, reporting and policy requirements.<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>The lecture also lists broader day-to-day roles: <strong>CISO<\/strong> (strategy), <strong>security engineer<\/strong> (builds controls), <strong>SOC analyst<\/strong> (monitors), and <strong>helpdesk<\/strong> (initial reports). These may overlap in smaller organizations.<\/p>\n<p><strong>Source:<\/strong> Incident response, slides 10, 13.<\/p>\n<h2>Business continuity vs disaster recovery vs incident response<\/h2>\n<table>\n<thead>\n<tr>\n<th>Activity<\/th>\n<th>Primary goal<\/th>\n<th>Example during ransomware<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>Incident response (IR)<\/strong><\/td>\n<td>Handle the security incident.<\/td>\n<td>Analyze compromise and contain affected systems.<\/td>\n<\/tr>\n<tr>\n<td><strong>Business continuity (BC)<\/strong><\/td>\n<td>Keep essential business services going.<\/td>\n<td>Use an alternate manual workflow while primary systems are down.<\/td>\n<\/tr>\n<tr>\n<td><strong>Disaster recovery (DR)<\/strong><\/td>\n<td>Restore IT systems and data after disruption.<\/td>\n<td>Recover servers/databases from verified backups.<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>BC teams may include a <strong>continuity manager<\/strong>, <strong>DR lead<\/strong>, application/database owners, facilities manager and HR/staff liaison. BCP is the <strong>business continuity plan<\/strong>; DRP is the <strong>disaster recovery plan<\/strong>.<\/p>\n<p><strong>Source:<\/strong> Incident response, slides 9–11.<\/p>\n<h2>RACI responsibility matrix<\/h2>\n<p><strong>RACI<\/strong> defines the relationship between a task and the people involved:<\/p>\n<ul>\n<li><strong>R — Responsible:<\/strong> does the work.<\/li>\n<li><strong>A — Accountable:<\/strong> ultimately owns the result/decision.<\/li>\n<li><strong>C — Consulted:<\/strong> gives input before or during the work.<\/li>\n<li><strong>I — Informed:<\/strong> receives updates.<\/li>\n<\/ul>\n<p><strong>Example:<\/strong> During recovery, a system administrator may be <strong>R<\/strong>, the incident coordinator <strong>A<\/strong>, an application owner <strong>C<\/strong>, and department managers <strong>I<\/strong>. Many organizations prefer <strong>one accountable owner<\/strong> for each important task to avoid confusion.<\/p>\n<p><strong>Source:<\/strong> Incident response, slide 12.<\/p>\n"},{"num":"13","slug":"review","title":"Exam revision and worked comparisons","short":"Exam revision & quiz","category":"Exam preparation","description":"Quick comparison tables, essential formulas, worked scenarios and 22 practice questions.","sections":5,"minutes":4,"html":"<blockquote>\n<p><strong>Study route<\/strong> · First understand definitions → then compare related concepts → then do a short worked calculation → finally answer a scenario question. The module document weights the end-semester exam at <strong>70%<\/strong> of the total module assessment.<\/p>\n<\/blockquote>\n<h2>The most important comparisons<\/h2>\n<table>\n<thead>\n<tr>\n<th>A<\/th>\n<th>B<\/th>\n<th>One-line difference<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>InfoSec<\/strong><\/td>\n<td>Cybersecurity<\/td>\n<td>All forms of information vs digital systems.<\/td>\n<\/tr>\n<tr>\n<td><strong>Authentication<\/strong><\/td>\n<td>Authorization<\/td>\n<td>Who are you? vs What can you do?<\/td>\n<\/tr>\n<tr>\n<td><strong>Threat<\/strong><\/td>\n<td>Vulnerability<\/td>\n<td>Potential danger vs weakness.<\/td>\n<\/tr>\n<tr>\n<td><strong>Risk<\/strong><\/td>\n<td>Impact<\/td>\n<td>Possibility of harmful outcome vs amount of harm.<\/td>\n<\/tr>\n<tr>\n<td><strong>Human error<\/strong><\/td>\n<td>Violation<\/td>\n<td>Accidental vs intentional rule-breaking.<\/td>\n<\/tr>\n<tr>\n<td><strong>IDS / HIDS<\/strong><\/td>\n<td>IPS / HIPS<\/td>\n<td>Detect/alert vs attempt to stop.<\/td>\n<\/tr>\n<tr>\n<td><strong>Symmetric<\/strong><\/td>\n<td>Asymmetric<\/td>\n<td>Shared key vs public/private pair.<\/td>\n<\/tr>\n<tr>\n<td><strong>Encryption<\/strong><\/td>\n<td>Hashing<\/td>\n<td>Reversible with key vs one-way digest.<\/td>\n<\/tr>\n<tr>\n<td><strong>Hash<\/strong><\/td>\n<td>HMAC<\/td>\n<td>Data digest vs keyed authentication tag.<\/td>\n<\/tr>\n<tr>\n<td><strong>Encryption<\/strong><\/td>\n<td>Digital signature<\/td>\n<td>Keep message secret vs prove signed integrity/origin.<\/td>\n<\/tr>\n<tr>\n<td><strong>Containment<\/strong><\/td>\n<td>Eradication<\/td>\n<td>Limit damage now vs remove cause.<\/td>\n<\/tr>\n<tr>\n<td><strong>IR<\/strong><\/td>\n<td>BC<\/td>\n<td>Resolve security incident vs maintain operations.<\/td>\n<\/tr>\n<tr>\n<td><strong>BC<\/strong><\/td>\n<td>DR<\/td>\n<td>Keep business running vs restore IT systems.<\/td>\n<\/tr>\n<tr>\n<td><strong>Policy<\/strong><\/td>\n<td>Procedure<\/td>\n<td>Rule/expectation vs how to perform it.<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h2>Memorize these numbers and formulas<\/h2>\n<table>\n<thead>\n<tr>\n<th>Topic<\/th>\n<th>Remember<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>CIA<\/strong><\/td>\n<td>Confidentiality, Integrity, Availability<\/td>\n<\/tr>\n<tr>\n<td><strong>PPT<\/strong><\/td>\n<td>People, Process, Technology<\/td>\n<\/tr>\n<tr>\n<td><strong>Caesar<\/strong><\/td>\n<td><code>C = (P+k) mod 26<\/code><\/td>\n<\/tr>\n<tr>\n<td><strong>DES<\/strong><\/td>\n<td>64-bit block; 56 effective key bits; 8 parity bits<\/td>\n<\/tr>\n<tr>\n<td><strong>3DES<\/strong><\/td>\n<td>EDE; 3 × DES, legacy; 168 nominal key bits for three-key variant, ~112 effective strength<\/td>\n<\/tr>\n<tr>\n<td><strong>AES<\/strong><\/td>\n<td>128-bit block; 128/192/256-bit keys; 10/12/14 rounds<\/td>\n<\/tr>\n<tr>\n<td><strong>RSA<\/strong><\/td>\n<td><code>n=pq<\/code>, <code>φ(n)=(p−1)(q−1)<\/code>, <code>ed ≡ 1 mod φ(n)<\/code><\/td>\n<\/tr>\n<tr>\n<td><strong>RSA encrypt/decrypt<\/strong><\/td>\n<td><code>C=M^e mod n<\/code>, <code>M=C^d mod n<\/code><\/td>\n<\/tr>\n<tr>\n<td><strong>Hash<\/strong><\/td>\n<td>MD5=128; SHA-1=160; SHA-256=256 bits<\/td>\n<\/tr>\n<tr>\n<td><strong>Fermat<\/strong><\/td>\n<td><code>a^(p−1) ≡ 1 mod p<\/code> when p prime and <code>p∤a<\/code><\/td>\n<\/tr>\n<tr>\n<td><strong>Euler<\/strong><\/td>\n<td><code>a^φ(n) ≡ 1 mod n<\/code> when <code>gcd(a,n)=1<\/code><\/td>\n<\/tr>\n<tr>\n<td><strong>SANS IR<\/strong><\/td>\n<td>Preparation → Identification → Containment → Eradication → Recovery → Lessons learned<\/td>\n<\/tr>\n<tr>\n<td><strong>RACI<\/strong><\/td>\n<td>Responsible, Accountable, Consulted, Informed<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<blockquote>\n<p><strong>Exam caution<\/strong> · A few slides contain older or simplified statements. This site calls them out next to the relevant topic, especially <strong>AES block length, 3DES, RC4, hash collisions, and NIST's older IR phases<\/strong>. For an exam question that explicitly asks <em>what the lecture says<\/em>, be aware of the distinction.<\/p>\n<\/blockquote>\n<h2>Active recall: test yourself<\/h2>\n<p>Select an answer, then check the explanation. Your score is saved only in this browser. Questions use the concepts and worked examples in the uploaded lectures.<\/p>\n<div id=\"quizRoot\" class=\"quiz-root\"><\/div>\n<h2>Five high-value scenarios<\/h2>\n<details><summary>1. A university's exam portal is offline during results day. Which CIA goal is affected?<\/summary><p><strong>Availability.<\/strong> Authorized users cannot access the portal when needed. Resilience controls include tested backups, failover, monitoring and adequate capacity.<\/p><\/details>\n<details><summary>2. A staff member unknowingly sends a sensitive file to the wrong email address. What type of insider issue?<\/summary><p><strong>Negligent / unintentional human error.<\/strong> It is not automatically a malicious insider. Good controls can include clear recipient warnings, permissions and awareness training.<\/p><\/details>\n<details><summary>3. A hacker knows an RSA user's public exponent e and modulus n. Why is the private exponent not easy to recover?<\/summary><p>The private exponent d depends on number-theory information connected to the factors of n. For correctly generated, sufficiently large RSA keys, recovering that private information from public information is computationally difficult using known classical techniques.<\/p><\/details>\n<details><summary>4. A file's downloaded SHA-256 matches a digest shown on the same compromised page. Is its origin proven?<\/summary><p><strong>No.<\/strong> The attacker may have replaced the file and hash together. A trusted digest, an HMAC or a verified signature is needed to support origin/integrity claims.<\/p><\/details>\n<details><summary>5. An organization isolates an infected laptop, removes malware and restores it from backup. Which SANS steps happened?<\/summary><p><strong>Containment<\/strong> (isolate), <strong>eradication<\/strong> (remove malware/cause), then <strong>recovery<\/strong> (restore and verify). Preparation and later lessons learned also matter.<\/p><\/details>\n<h2>What your module expects<\/h2>\n<p>The course document (CS32042) lists learning outcomes covering <strong>foundations<\/strong>, <strong>threats and controls<\/strong>, <strong>incidents and countermeasures<\/strong>, <strong>incident response<\/strong>, <strong>private/public-key cryptography<\/strong>, and <strong>confidentiality and data completeness<\/strong>. It lists practical topics: <strong>OpenSSL/Python encryption<\/strong>, <strong>Wireshark packet analysis<\/strong>, and a <strong>risk assessment exercise<\/strong>.<\/p>\n<p><strong>Coverage note:<\/strong> the module syllabus names a separate <strong>Server &amp; Network Security<\/strong> lecture. The supplied PDFs include endpoint/network controls, but do <strong>not<\/strong> include a dedicated lecture PDF for that topic. The website covers network-defense concepts present in the provided files rather than pretending a missing lecture was supplied.<\/p>\n<p><strong>Source:<\/strong> Module description, pages 2–5; all supplied lectures.<\/p>\n"}];</script><script>(() => {
  'use strict';
  const chapters = window.STUDY_CHAPTERS || [];
  const app = document.getElementById('app');
  const groups = [
    ['START HERE', ['foundations','people','endpoints']],
    ['CRYPTOGRAPHY', ['crypto-basics','math','symmetric','asymmetric','pki','hashes']],
    ['MANAGEMENT & RESPONSE', ['risk','governance','incidents']],
    ['EXAM PREP', ['review']]
  ];
  const $ = (selector, root=document) => root.querySelector(selector);
  const $$ = (selector, root=document) => Array.from(root.querySelectorAll(selector));
  const escapeHTML = text => String(text).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const localGet = (key, fallback) => { try { const val = JSON.parse(localStorage.getItem(key)); return val === null ? fallback : val; } catch { return fallback; } };
  const localSet = (key, val) => { try { localStorage.setItem(key,JSON.stringify(val)); } catch {} };
  let completed = localGet('infosec-completed-v1', []);
  if (!Array.isArray(completed)) completed=[];
  let theme = localGet('infosec-theme-v1', 'light');
  if (theme !== 'dark') theme = 'light';
  document.body.dataset.theme = theme;
  let activeSlug = null;
  let index = [];
  let quizState = { question:0, answers:[], show:false };
  const icons = {
    search:'<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><circle cx="11" cy="11" r="7.2"/><path d="m16.5 16.5 5 5"/></svg>',
    menu:'<svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 7h16M4 12h16M4 17h16"/></svg>',
    moon:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><path d="M20.5 14a8.7 8.7 0 0 1-10.7-10.7A8.8 8.8 0 1 0 20.5 14Z"/></svg>',
    sun:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.42 1.42m11.3 11.3 1.42 1.42M2 12h2m16 0h2M4.93 19.07l1.42-1.42m11.3-11.3 1.42-1.42"/></svg>',
    shield:'<svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="1.6" stroke-linejoin="round"><path d="m12 2 8 4v6c0 4.6-3.2 8-8 10-4.8-2-8-5.4-8-10V6l8-4Z"/><path d="m8.5 12 2.5 2.5 4.5-5"/></svg>'
  };
  const chapter = slug => chapters.find(c=>c.slug===slug);
  const sectionId = title => title.toLowerCase().normalize('NFKD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');
  const route = () => { const pieces = (location.hash.replace(/^#\/?/,'') || 'home').split('/'); return {slug:pieces[0]||'home',section:pieces[1]||null}; };
  const homeRoute = () => '#/home';
  const href = slug => `#/${slug}`;
  const findNext = () => chapters.find(c=>!completed.includes(c.slug)) || chapters[0];
  const duration = c => `${c.minutes} min read`;
  function sidebar() {
    return `<aside id="sidebar" class="sidebar" aria-label="Course navigation">
      <a class="brand-row" href="${homeRoute()}"><span class="brand-mark">${icons.shield}</span><span><span class="brand-title">Information Security</span><br><span class="brand-sub">CS32042 · EXAM NOTES</span></span></a>
      <nav class="sidebar-main">
        <a class="nav-item ${activeSlug==='home'?'active':''}" href="${homeRoute()}"><span class="nav-num">⌂</span><span>Overview</span></a>
        ${groups.map(g=>`<div class="side-label">${g[0]}</div>${g[1].map(id=>{const c=chapter(id),done=completed.includes(id);return `<a href="${href(id)}" class="nav-item ${activeSlug===id?'active':''} ${done?'done':''}" ${activeSlug===id?'aria-current="page"':''}><span class="nav-num">${done?'✓':c.num}</span><span>${escapeHTML(c.short)}</span></a>`;}).join('')}`).join('')}
      </nav>
      <div class="side-foot"><div class="side-progress-top"><span>Study progress</span><b>${completed.length} / ${chapters.length}</b></div><div class="progress-track"><div class="progress-fill" style="width:${Math.round(completed.length/chapters.length*100)}%"></div></div><div class="side-foot-note">Your progress stays in this browser.</div></div>
    </aside>`;
  }
  function topbar() {
    const title = activeSlug==='home'?'Overview':chapter(activeSlug)?.short || 'Overview';
    return `<header class="topbar"><div style="display:flex;align-items:center;gap:12px;min-width:0"><button id="menuBtn" class="icon-btn mobile-menu" aria-label="Open navigation">${icons.menu}</button><div class="crumbs">CS32042 <span class="divider">/</span> <b>${escapeHTML(title)}</b></div></div><div class="top-actions"><button type="button" class="search-trigger" id="searchBtn" aria-label="Search study notes"><span>${icons.search}<span class="search-label">Search lessons...</span></span><span class="kbd">Ctrl K</span></button><button id="themeBtn" class="icon-btn" aria-label="Toggle light or dark mode" title="Toggle theme">${theme==='dark'?icons.sun:icons.moon}</button></div></header>`;
  }
  function heroArt(){ return `<div class="hero-art" aria-hidden="true"><svg viewBox="0 0 300 300" fill="none"><circle cx="150" cy="150" r="110" stroke="#97b6ee" stroke-opacity=".3" stroke-dasharray="4 9"/><circle cx="150" cy="150" r="76" stroke="#93b7fa" stroke-opacity=".3"/><path d="M150 53 232 101v94l-82 50-82-50v-94l82-48Z" stroke="#dceafa" stroke-opacity=".55" stroke-width="2"/><path d="m150 91 49 28v62l-49 29-49-29v-62l49-28Z" fill="#8faef2" fill-opacity=".18" stroke="#afccfb" stroke-opacity=".8"/><path d="m130 150 16 16 28-33" stroke="#d0f8e8" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><circle cx="150" cy="53" r="5" fill="#88dcc9"/><circle cx="232" cy="195" r="5" fill="#90baff"/><circle cx="68" cy="195" r="5" fill="#90baff"/><path d="M150 0v40M0 150h45M255 150h45M150 260v40" stroke="#9fc4fa" stroke-opacity=".25"/></svg></div>`; }
  function home() {
    const next=findNext();
    return `<main class="page-area home-page" id="main" tabindex="-1">
      <section class="hero"><div class="hero-copy"><div class="hero-badge">Your personal security study guide</div><h1>Information Security,<br><em>made understandable.</em></h1><p>Everything essential from your lecture notes — clear explanations, useful diagrams, worked cryptography examples, and focused exam revision.</p><a class="primary-btn" href="${href(next.slug)}">${completed.length?'Continue learning':'Start learning'} <span>→</span></a></div>${heroArt()}</section>
      <div class="stat-grid"><div class="stat"><div class="k">${chapters.length}</div><small>Study chapters</small></div><div class="stat"><div class="k">13</div><small>Source PDFs</small></div><div class="stat"><div class="k" id="homeProgress">${Math.round(completed.length/chapters.length*100)}%</div><small>Chapters completed</small></div></div>
      <div class="section-header"><div><h2>Choose a chapter</h2><p>Organized by concepts, not scattered slide order.</p></div><span class="mini-hint">${chapters.reduce((n,c)=>n+c.sections,0)} guided sections</span></div>
      <div class="chapters-grid">${chapters.map(c=>`<a href="${href(c.slug)}" class="chapter-card"><div class="card-top"><span class="card-number">CHAPTER ${c.num}</span><span class="card-status ${completed.includes(c.slug)?'':'unread'}">${completed.includes(c.slug)?'✓ Completed':'○ Not completed'}</span></div><h3>${escapeHTML(c.title)}</h3><p>${escapeHTML(c.description)}</p><div class="card-bottom"><span>${c.sections} sections · ${duration(c)}</span><span class="arrow">↗</span></div></a>`).join('')}</div>
      <div class="home-foot"><strong>About these notes.</strong> Built from 13 uploaded PDFs: the module outline, introduction, human factors, cryptography, arithmetic, symmetric and asymmetric algorithms, PKI, hashes, endpoints, risk management, governance, and incident response. Added explanations and modern corrections are marked in context. Original lecture framing is preserved for exam study. No internet connection or account is needed to read this site.</div>
    </main>`;
  }
  function renderChapter(c) {
    const n=chapters.indexOf(c), prev=chapters[n-1], next=chapters[n+1];
    return `<main class="page-area" id="main" tabindex="-1"><div class="reader-layout"><div class="reader-main">
      <header class="chapter-intro"><span class="eyebrow">CHAPTER ${c.num} · ${escapeHTML(c.category)}</span><h1>${escapeHTML(c.title)}</h1><p>${escapeHTML(c.description)}</p><div class="reading-meta"><span class="meta-pill">◷ ${duration(c)}</span><span class="meta-dot"></span><span class="meta-pill">☷ ${c.sections} sections</span><button id="completeBtn" type="button" class="complete-btn ${completed.includes(c.slug)?'completed':''}">${completed.includes(c.slug)?'✓ Chapter completed':'○ Mark as completed'}</button></div></header>
      <article class="article" id="articleContent">${c.html}</article>
      <nav class="chapter-nav" aria-label="Chapter navigation">${prev?`<a href="${href(prev.slug)}"><span>← PREVIOUS CHAPTER</span>${escapeHTML(prev.short)}</a>`:`<a href="${homeRoute()}"><span>← BACK</span>Overview</a>`}${next?`<a href="${href(next.slug)}"><span>NEXT CHAPTER →</span>${escapeHTML(next.short)}</a>`:`<a href="${homeRoute()}"><span>↗ END OF NOTES</span>Back to overview</a>`}</nav>
      </div><aside class="toc" id="toc" aria-label="On this page"><h4>On this page</h4><div id="tocLinks"></div><div class="toc-foot"><p>Tip: Press <b>/</b> to search for a concept across all lectures.</p></div></aside></div></main>`;
  }
  function render() {
    const r=route(); activeSlug=chapter(r.slug)?r.slug:'home';
    document.title=(activeSlug==='home'?'Exam Companion':`${chapter(activeSlug).title} · Exam Notes`) + ' | Information Security';
    app.innerHTML=`<div class="app">${sidebar()}<div class="content-shell">${topbar()}${activeSlug==='home'?home():renderChapter(chapter(activeSlug))}</div></div>`;
    $('#themeBtn').addEventListener('click',toggleTheme);
    $('#searchBtn').addEventListener('click',openSearch);
    $('#menuBtn').addEventListener('click',()=>$('#sidebar').classList.toggle('open'));
    $$('.sidebar .nav-item,.sidebar .brand-row').forEach(a=>a.addEventListener('click',()=>$('#sidebar').classList.remove('open')));
    if(activeSlug!=='home'){
      const c=chapter(activeSlug);
      const used=new Set();
      const h2s=$$('#articleContent h2');
      h2s.forEach(h=>{let id=sectionId(h.textContent)||'section',j=1;while(used.has(id))id=sectionId(h.textContent)+'-'+(++j);used.add(id);h.id=id;});

      $$('#tocLinks a').forEach(a=>a.addEventListener('click',e=>{e.preventDefault();location.hash=a.getAttribute('href');goToSection(a.dataset.toc);}));
      $('#completeBtn').addEventListener('click',()=>{completed=completed.includes(c.slug)?completed.filter(x=>x!==c.slug):[...completed,c.slug];localSet('infosec-completed-v1',completed);render();window.scrollTo({top:0,behavior:'instant'});});
      bindTools();
      if(activeSlug==='review') setupQuiz();
    }
    if(r.section) requestAnimationFrame(()=>goToSection(r.section,'instant'));
    else window.scrollTo({top:0,behavior:'instant'});
  }
  function goToSection(id, behavior='smooth') {

    if(el){el.scrollIntoView({behavior,block:'start'});$$('#tocLinks a').forEach(a=>a.classList.toggle('active',a.dataset.toc===id));}
  }
  function toggleTheme(){theme=theme==='dark'?'light':'dark';document.body.dataset.theme=theme;localSet('infosec-theme-v1',theme);$('#themeBtn').innerHTML=theme==='dark'?icons.sun:icons.moon;}
  function buildIndex() {
    index=[];
    chapters.forEach(c=>{
      const root=document.createElement('div');root.innerHTML=c.html;
      index.push({slug:c.slug,title:c.title,text:c.description,section:null,group:c.category});
      const headings=$$('h2',root);
      headings.forEach((head,i)=>{
        let text='';let node=head.nextElementSibling;
        while(node && node.tagName!=='H2' && text.length<900){text+=' '+node.textContent;node=node.nextElementSibling;}
        index.push({slug:c.slug,title:head.textContent,section:sectionId(head.textContent),text:text.replace(/\s+/g,' ').trim(),group:c.title});
      });
    });
  }
  function searchHits(q) {
    const query=q.trim().toLowerCase();
    if (!query) return index.filter(x=>!x.section).slice(0,8);
    const words=query.split(/\s+/).filter(Boolean);
    return index.map(x=>{const title=x.title.toLowerCase(),all=(x.title+' '+x.text+' '+x.group).toLowerCase();const matches=words.every(w=>all.includes(w));const score=matches?words.reduce((n,w)=>n+(title.includes(w)?12:0)+(x.group.toLowerCase().includes(w)?2:0),0)+(x.section?3:1):0;return {...x,score};}).filter(x=>x.score>0).sort((a,b)=>b.score-a.score).slice(0,12);
  }
  function openSearch(){
    if($('#searchBackdrop'))return;
    const backdrop=document.createElement('div');backdrop.id='searchBackdrop';backdrop.className='search-backdrop';backdrop.innerHTML=`<div class="search-dialog" role="dialog" aria-label="Search all notes" aria-modal="true"><div class="search-box">${icons.search}<input id="searchInput" type="search" autocomplete="off" placeholder="Search any topic, formula, term..." aria-label="Search notes"><kbd>ESC</kbd></div><div class="search-results" id="searchResults"></div><div class="search-help">Type to search chapter names and full section text · Select a result to jump to it</div></div>`;
    document.body.append(backdrop);const input=$('#searchInput');const results=$('#searchResults');
    const show=()=>{const hits=searchHits(input.value);results.innerHTML=hits.length?hits.map((x,i)=>`<button type="button" class="search-hit" data-pos="${i}"><small>${escapeHTML(x.group)}</small><strong>${escapeHTML(x.title)}</strong>${x.text?`<p>${escapeHTML(x.text.slice(0,180))}${x.text.length>180?'…':''}</p>`:''}</button>`).join(''):'<div class="search-empty">No matches. Try another term.</div>';
      $$('.search-hit',results).forEach(b=>b.addEventListener('click',()=>{const x=hits[Number(b.dataset.pos)];closeSearch();location.hash=`#/${x.slug}${x.section?'/'+x.section:''}`;if(activeSlug===x.slug&&x.section)goToSection(x.section);}));};
    backdrop.addEventListener('click',e=>{if(e.target===backdrop)closeSearch();});
    input.addEventListener('input',show);input.addEventListener('keydown',e=>{if(e.key==='Enter'){const btn=$('.search-hit',results);if(btn)btn.click();}});
    show();input.focus();
  }
  function closeSearch(){const el=$('#searchBackdrop');if(el)el.remove();}
  function bindTools(){
    const caesarInput=$('#caesarInput'), shift=$('#caesarShift');
    if(caesarInput&&shift){const update=()=>{const k=Number(shift.value);$('#shiftOut').textContent=k;$('#caesarOutput').textContent=caesarInput.value.replace(/[a-z]/gi,ch=>{const upper=ch.toUpperCase();return String.fromCharCode((upper.charCodeAt(0)-65+k)%26+65).replace(/^./, c => ch===ch.toLowerCase()?c.toLowerCase():c);});};caesarInput.addEventListener('input',update);shift.addEventListener('input',update);update();}
    if($('#gcdRun')){$('#gcdRun').addEventListener('click',()=>{let a=Number($('#gcdA').value),b=Number($('#gcdB').value);if(!Number.isSafeInteger(a)||!Number.isSafeInteger(b)||a<1||b<1||a>1e9||b>1e9){$('#gcdResult').textContent='Use positive whole numbers below 1,000,000,001.';return;}if(a<b)[a,b]=[b,a];const lines=[];while(b!==0){const q=Math.floor(a/b),r=a%b;lines.push(`${a} = ${q} × ${b} + ${r}`);a=b;b=r;}lines.push(`GCD = ${a} (last nonzero remainder)`);$('#gcdResult').textContent=lines.join('\n');});$('#gcdRun').click();}
    if($('#rsaRun')){$('#rsaRun').addEventListener('click',()=>{
      const p=Number($('#rsaP').value),q=Number($('#rsaQ').value),e=Number($('#rsaE').value),m=Number($('#rsaM').value),out=$('#rsaResult');
      const prime=x=>Number.isInteger(x)&&x>=2&&Array.from({length:Math.floor(Math.sqrt(x))-1},(_,i)=>i+2).every(d=>x%d!==0);
      if (![p,q,e,m].every(Number.isSafeInteger)||p>500||q>500||p===q||!prime(p)||!prime(q)){out.textContent='Choose two different primes between 2 and 500.';return;}
      const n=p*q,phi=(p-1)*(q-1);let a=e,b=phi;while(b!==0){[a,b]=[b,a%b];}if(e<=1||e>=phi||a!==1||m<0||m>=n){out.textContent=`Need 1 < e < φ(n) = ${phi}, gcd(e, φ(n)) = 1, and 0 ≤ M < n (${n}).`;return;}
      const E=BigInt(e),N=BigInt(n),M=BigInt(m);let d=1;while((e*d)%phi!==1&&d<=phi)d++;
      function powMod(a,k,mod){a%=mod;let r=1n;while(k>0n){if(k&1n)r=r*a%mod;a=a*a%mod;k>>=1n;}return r;}
      const c=powMod(M,E,N),original=powMod(c,BigInt(d),N);
      out.textContent=`p = ${p}, q = ${q}\nn = p × q = ${n}\nφ(n) = (${p}-1) × (${q}-1) = ${phi}\nPublic key: (e,n) = (${e},${n})\nPrivate exponent: d = ${d} (because ${e}×${d} mod ${phi} = 1)\nEncrypt: ${m}^${e} mod ${n} = ${c}\nDecrypt: ${c}^${d} mod ${n} = ${original}`;
    });$('#rsaRun').click();}
  }
  const questions = [
    ['What does the C in CIA stand for?',['Correctness','Confidentiality','Compliance','Control'],1,'Confidentiality means that only authorized parties can access information.'],
    ['A student can log in but cannot edit grades. Which concept controls the edit permission?',['Authentication','Availability','Authorization','Non-repudiation'],2,'Authorization determines what an authenticated user may do.'],
    ['Which is a vulnerability?',['A database','An unpatched operating system','A criminal group','A backup'],1,'A vulnerability is an exploitable weakness, such as unpatched software.'],
    ['What is the best label for an employee who accidentally makes a private cloud folder public?',['Malicious insider','Negligent insider','External attacker','Physical threat'],1,'It is an unintentional error by a trusted insider.'],
    ['An attacker claims to be your manager and demands an immediate password reset. Which triggers?',['Integrity and availability','Authority and urgency','Redundancy and privacy','Encryption and hashing'],1,'Social engineers often combine pressure from apparent authority and time.'],
    ['What does an IPS generally do beyond IDS detection?',['Back up files','Block selected suspicious activity','Issue public-key certificates','Replace user passwords'],1,'An intrusion prevention system may actively block suspicious traffic.'],

    ['Which of these is a symmetric block cipher?',['SHA-256','HMAC','AES','RSA'],2,'AES is a symmetric block cipher with a 128-bit block size.'],

    ['What is AES-256’s block size?',['64 bits','128 bits','192 bits','256 bits'],1,'All standardized AES variants operate on 128-bit blocks. AES-256 refers to its key length.'],
    ['What does the RSA expression n = pq mean?',['The hash of the message','Product of two primes','Number of users','A symmetric session key'],1,'n is the modulus made by multiplying the two RSA primes.'],
    ['For RSA p=11 and q=17, what is φ(n)?',['17','23','160','187'],2,'φ(11×17)=(11−1)(17−1)=10×16=160.'],
    ['What is gcd(8,15)?',['1','3','5','8'],0,'8 and 15 share no positive divisor except 1: they are coprime.'],
    ['Which key does Bob use to decrypt a message encrypted with Bob’s public key?',["Alice's private key","Bob's private key","Bob's public key","The CA's private key"],1,'Only Bob should hold the private key corresponding to his public key.'],
    ['Which key does Alice normally use to create her digital signature?',["Bob's public key","Alice's public key","Alice's private key","The TLS session key"],2,'The private signing key creates the signature. The public key verifies it.'],
    ['What does a CA do in PKI?',['Select everyone’s passwords','Sign identity-to-public-key certificates','Decrypt all TLS traffic','Calculate file hashes only'],1,'A CA signs certificates to assert a checked binding between identity/name and public key.'],
    ['Which statement about collisions in hashes is correct?',['They are mathematically impossible','Any SHA-256 hash is reversible','They exist, but should be hard to find','A hash always hides a message'],2,'Fixed-size outputs mean collisions exist; secure hashes make finding them computationally difficult.'],
    ['What does HMAC need besides a message and a hash function?',['A secret key','A CA certificate','An RSA modulus','A second plaintext'],0,'HMAC adds a shared secret key to provide message authentication.'],
    ['Which is NOT one of the four main risk responses?',['Avoid','Mitigate','Accept','Ignore without decision'],3,'The usual set is avoid, mitigate, transfer/share, and accept.'],
    ['In incident response, what is containment?',['Write post-incident lessons','Limit immediate spread and damage','Restore all IT services','Create a CA hierarchy'],1,'Containment limits the incident while investigation and eradication continue.'],
    ['What does the A in RACI mean?',['Authorized','Audited','Accountable','Available'],2,'Accountable is the person ultimately answerable for the task or decision.'],
    ['How does business continuity differ from disaster recovery?',['Continuity is broader; DR restores IT','Continuity only restores disks','They are exactly identical','DR only handles human mistakes'],0,'Business continuity keeps essential operations going; disaster recovery focuses on restoring technology and data.']
  ];
  function setupQuiz(){quizState={question:0,answers:[],show:false};renderQuiz();}
  function renderQuiz(){const root=$('#quizRoot');if(!root)return;const state=quizState;if(state.question>=questions.length){const score=state.answers.reduce((s,a,i)=>s+(a===questions[i][2]?1:0),0);localSet('infosec-last-quiz-v1',{score,total:questions.length});root.innerHTML=`<div class="quiz-card quiz-finish"><span class="eyebrow">PRACTICE COMPLETE</span><strong>${score} / ${questions.length}</strong><p>${score>=19?'Strong recall. Review any explanations you missed.':'Use the relevant chapters to revisit missed concepts, then try again.'}</p><button class="tool-button" id="quizReset">Try again</button></div>`;$('#quizReset').addEventListener('click',setupQuiz);return;}
    const i=state.question,q=questions[i],selected=state.answers[i];root.innerHTML=`<div class="quiz-progress"><span>Question ${i+1} of ${questions.length}</span><strong>${state.answers.reduce((s,a,k)=>s+(a===questions[k][2]?1:0),0)} correct so far</strong></div><div class="progress-track" style="margin:0 0 17px"><div class="progress-fill" style="width:${i/questions.length*100}%"></div></div><div class="quiz-card"><div class="quiz-question">${escapeHTML(q[0])}</div>${q[1].map((v,j)=>`<button class="quiz-option ${state.show?(j===q[2]?'correct':j===selected?'wrong':''):''}" data-choice="${j}" ${state.show?'disabled':''}><span>${String.fromCharCode(65+j)}</span>${escapeHTML(v)}</button>`).join('')}${state.show?`<div class="quiz-answer"><strong>${selected===q[2]?'✓ Correct.':'Explanation'}</strong><br>${escapeHTML(q[3])}</div>`:''}<button type="button" class="quiz-next" id="quizNext" ${!state.show?'disabled':''}>${i===questions.length-1?'View score':'Next question →'}</button></div>`;
    $$('.quiz-option',root).forEach(btn=>btn.addEventListener('click',()=>{state.answers[i]=Number(btn.dataset.choice);state.show=true;renderQuiz();}));$('#quizNext').addEventListener('click',()=>{if(state.show){state.question++;state.show=false;renderQuiz();const quizTop=$('#quizRoot');if(quizTop){const y=quizTop.getBoundingClientRect().top+scrollY-120;if(y<scrollY-250)scrollTo({top:y,behavior:'smooth'});}}});
  }
  function init(){buildIndex();render();}
  window.addEventListener('hashchange',render);
  document.addEventListener('keydown',e=>{const typing=/^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement?.tagName);if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){e.preventDefault();openSearch();}else if(e.key==='/'&&!typing&&!$('#searchBackdrop')){e.preventDefault();openSearch();}else if(e.key==='Escape'){closeSearch();if($('#sidebar'))$('#sidebar').classList.remove('open');}});
  document.addEventListener('click',e=>{if($('#sidebar')?.classList.contains('open')&&!e.target.closest('#sidebar')&&!e.target.closest('#menuBtn'))$('#sidebar').classList.remove('open');});
  init();
})();

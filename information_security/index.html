</style></head><body><div id="app"></div><script>window.STUDY_CHAPTERS=[{"num":"01","slug":"foundations","title":"Security foundations","short":"Security foundations","category":"Security essentials","description":"Protecting information, the CIA triad, access rules, and essential security vocabulary.","sections":5,"minutes":5,"html":"<blockquote>\n<p><strong>Core idea<\/strong> · Information security protects valuable information, regardless of whether it is stored on a computer, written on paper, or spoken aloud. Cybersecurity focuses on the digital part of that problem.<\/p>\n<\/blockquote>\n<h2>What are we protecting?<\/h2>\n<p><strong>Information security (InfoSec)<\/strong> is the practice of protecting information and information systems from unauthorized access, disclosure, change, destruction, or disruption throughout their life cycle. It includes <strong>information, hardware, software, networks, processes, people, and facilities<\/strong>. A good security program combines technology with policies, procedures, training, and risk management.<\/p>\n<table>\n<thead>\n<tr>\n<th>Information security<\/th>\n<th>Cybersecurity<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Protects <strong>all forms<\/strong> of information: digital, paper, verbal, physical records.<\/td>\n<td>Protects <strong>digital systems<\/strong>, networks, devices, applications, and data against cyber threats.<\/td>\n<\/tr>\n<tr>\n<td>Example: locking a filing cabinet containing medical records.<\/td>\n<td>Example: securing the database holding those records.<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>Why does it matter?<\/strong> It helps protect sensitive data, stop unauthorized access, keep services running, meet legal requirements, reduce financial damage, and maintain trust. Common targets include banking information, medical records, research data, student results, and government databases.<\/p>\n<p><strong>Source:<\/strong> Introduction, slides 2–6.<\/p>\n<h2>The CIA triad<\/h2>\n<div class=\"triad-wrap\"><svg viewBox=\"0 0 640 275\" role=\"img\" aria-label=\"Confidentiality, Integrity and Availability form the CIA triad\"><path d=\"M320 36L102 232h436Z\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" opacity=\".25\"/><circle cx=\"320\" cy=\"43\" r=\"41\" fill=\"#6572e8\"/><circle cx=\"108\" cy=\"226\" r=\"41\" fill=\"#20b8a7\"/><circle cx=\"530\" cy=\"226\" r=\"41\" fill=\"#f0aa60\"/><text x=\"320\" y=\"49\" text-anchor=\"middle\" fill=\"white\" font-size=\"18\" font-weight=\"700\">C<\/text><text x=\"108\" y=\"232\" text-anchor=\"middle\" fill=\"white\" font-size=\"18\" font-weight=\"700\">I<\/text><text x=\"530\" y=\"232\" text-anchor=\"middle\" fill=\"white\" font-size=\"18\" font-weight=\"700\">A<\/text><text x=\"320\" y=\"150\" fill=\"currentColor\" font-size=\"20\" font-weight=\"700\" text-anchor=\"middle\">Information<\/text><text x=\"320\" y=\"173\" fill=\"currentColor\" font-size=\"13\" text-anchor=\"middle\">Security<\/text><text x=\"320\" y=\"106\" fill=\"currentColor\" font-size=\"13\" text-anchor=\"middle\">Confidentiality<\/text><text x=\"108\" y=\"170\" fill=\"currentColor\" font-size=\"13\" text-anchor=\"middle\">Integrity<\/text><text x=\"530\" y=\"170\" fill=\"currentColor\" font-size=\"13\" text-anchor=\"middle\">Availability<\/text><\/svg><\/div>\n<table>\n<thead>\n<tr>\n<th>Goal<\/th>\n<th>Simple meaning<\/th>\n<th>Example<\/th>\n<th>Typical controls<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>Confidentiality<\/strong><\/td>\n<td>Only authorized people can see information.<\/td>\n<td>Only the correct student can see their exam results.<\/td>\n<td>Access control, encryption, MFA.<\/td>\n<\/tr>\n<tr>\n<td><strong>Integrity<\/strong><\/td>\n<td>Information stays correct and complete; unauthorized changes can be detected or stopped.<\/td>\n<td>Grades cannot be secretly changed.<\/td>\n<td>Hashes, digital signatures, permissions, audit trails.<\/td>\n<\/tr>\n<tr>\n<td><strong>Availability<\/strong><\/td>\n<td>Authorized users can reach services when needed.<\/td>\n<td>The LMS works during an exam.<\/td>\n<td>Backups, redundancy, UPS, disaster recovery.<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<blockquote>\n<p><strong>Don't mix these up<\/strong> · Encrypting a file primarily provides <strong>confidentiality<\/strong>. A plain hash can help check <strong>integrity<\/strong>, but only when you have a trustworthy expected hash. Keeping a backup primarily helps <strong>availability<\/strong> and recovery. A single control can help several goals.<\/p>\n<\/blockquote>\n<p><strong>Source:<\/strong> Introduction, slides 7–9.<\/p>\n<h2>Security goals beyond CIA<\/h2>\n<table>\n<thead>\n<tr>\n<th>Goal<\/th>\n<th>What question does it answer?<\/th>\n<th>Example<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>Authentication<\/strong><\/td>\n<td><em>Who are you?<\/em><\/td>\n<td>Checking a password or passkey.<\/td>\n<\/tr>\n<tr>\n<td><strong>Authorization<\/strong><\/td>\n<td><em>What may you do?<\/em><\/td>\n<td>Student can view grades; lecturer can edit them.<\/td>\n<\/tr>\n<tr>\n<td><strong>Accountability<\/strong><\/td>\n<td><em>Who did what?<\/em><\/td>\n<td>Audit log shows who changed a record.<\/td>\n<\/tr>\n<tr>\n<td><strong>Non-repudiation<\/strong><\/td>\n<td><em>Can there be convincing proof of an action's origin?<\/em><\/td>\n<td>A valid digital signature helps show a message was signed by a specific key.<\/td>\n<\/tr>\n<tr>\n<td><strong>Privacy<\/strong><\/td>\n<td><em>How may personal information be collected and used?<\/em><\/td>\n<td>Only using student data for an agreed purpose.<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>Authentication is not authorization.<\/strong> Logging in identifies an account; the system must still check whether that account has permission for a particular action. <strong>Accountability is not the same as non-repudiation<\/strong>: a log supports investigation, but may be editable; a digital signature provides stronger cryptographic evidence of origin and integrity when keys and identities are properly managed.<\/p>\n<blockquote>\n<p><strong>Extra explanation<\/strong> · A digital signature does <strong>not<\/strong> prove by itself that a particular human physically clicked a button. It proves that a signature matches a cryptographic key. Identity checks, key protection, and procedures are still necessary.<\/p>\n<\/blockquote>\n<p><strong>Source:<\/strong> Introduction, slides 10–15.<\/p>\n<h2>Security vocabulary — follow the chain<\/h2>\n<div class=\"diagram-flow\"><span>Asset<\/span><b>→<\/b><span>Threat<\/span><b>+<\/b><span>Vulnerability<\/span><b>→<\/b><span>Risk<\/span><b>→<\/b><span>Possible loss<\/span><\/div>\n<table>\n<thead>\n<tr>\n<th>Term<\/th>\n<th>Meaning<\/th>\n<th>Example<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>Asset<\/strong><\/td>\n<td>Anything of value worth protecting.<\/td>\n<td>Student database, laptop, paper file.<\/td>\n<\/tr>\n<tr>\n<td><strong>Subject<\/strong><\/td>\n<td>An active entity requesting access.<\/td>\n<td>A user, process, or app.<\/td>\n<\/tr>\n<tr>\n<td><strong>Object<\/strong><\/td>\n<td>The resource being accessed.<\/td>\n<td>A file, database table, device.<\/td>\n<\/tr>\n<tr>\n<td><strong>Access<\/strong><\/td>\n<td>Ability to read, use, change, or manage a resource.<\/td>\n<td>Viewing a document.<\/td>\n<\/tr>\n<tr>\n<td><strong>Threat<\/strong><\/td>\n<td>Something that could cause harm.<\/td>\n<td>A criminal trying to steal records.<\/td>\n<\/tr>\n<tr>\n<td><strong>Vulnerability<\/strong><\/td>\n<td>A weakness that may be exploited.<\/td>\n<td>Weak password, unpatched server.<\/td>\n<\/tr>\n<tr>\n<td><strong>Exploit<\/strong><\/td>\n<td>A method that uses a vulnerability.<\/td>\n<td>A malicious request abusing a software flaw.<\/td>\n<\/tr>\n<tr>\n<td><strong>Exposure<\/strong><\/td>\n<td>A situation where an asset is reachable or at risk.<\/td>\n<td>Unprotected database visible online.<\/td>\n<\/tr>\n<tr>\n<td><strong>Attack<\/strong><\/td>\n<td>An attempt to compromise CIA.<\/td>\n<td>Malware infection.<\/td>\n<\/tr>\n<tr>\n<td><strong>Control / safeguard<\/strong><\/td>\n<td>A measure that reduces risk.<\/td>\n<td>MFA, firewall, backups.<\/td>\n<\/tr>\n<tr>\n<td><strong>Risk<\/strong><\/td>\n<td>The possibility of loss due to uncertainty and harmful events.<\/td>\n<td>Unauthorized access to the database.<\/td>\n<\/tr>\n<tr>\n<td><strong>Loss / impact<\/strong><\/td>\n<td>Harm that occurs when a bad event happens.<\/td>\n<td>Costs, downtime, stolen data.<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>Scenario:<\/strong> A <strong>customer database (asset)<\/strong> is available on the internet (<strong>exposure<\/strong>). Its admin account has a weak password (<strong>vulnerability<\/strong>). Someone attempts account takeover (<strong>threat/attack<\/strong>). The <strong>risk<\/strong> is a breach; <strong>loss<\/strong> could include leaked records and costs. <strong>MFA, stronger credentials, and access rules<\/strong> are safeguards.<\/p>\n<blockquote>\n<p><strong>Exam distinction<\/strong> · A threat is <em>potential danger<\/em>. A vulnerability is <em>a weakness<\/em>. Risk is <em>the possibility of harm when danger meets a weakness<\/em>. An attack is an actual attempt; an exploit is how a weakness is used.<\/p>\n<\/blockquote>\n<p><strong>Source:<\/strong> Introduction, slides 16–23.<\/p>\n<h2>Common threats and incidents<\/h2>\n<p><strong>Malware<\/strong> is malicious software. <strong>Phishing<\/strong> uses deceptive messages or sites to trick people. <strong>Social engineering<\/strong> is broader manipulation of human behavior. <strong>Insider threats<\/strong> come from trusted accounts or people. <strong>Ransomware<\/strong> typically blocks access to data or systems and demands payment. <strong>Denial of service (DoS)<\/strong> disrupts service availability. A <strong>data breach<\/strong> exposes information to unauthorized parties.<\/p>\n<p>The lecture uses <strong>WannaCry (2017)<\/strong> and the <strong>Colonial Pipeline ransomware incident (2021)<\/strong> as real-world examples. Think of them as illustrations of the combined impact on systems, business continuity, and public services.<\/p>\n<p><strong>Source:<\/strong> Introduction, slides 25–28.<\/p>\n"},{"num":"02","slug":"people","title":"People and social engineering","short":"Human factors and social engineering","category":"Security essentials","description":"Human error, persuasion, insider threats, security awareness, and people-process-technology.","sections":5,"minutes":4,"html":"<blockquote>\n<p><strong>Core idea<\/strong> · A security system is more than software. People make decisions, processes define safe behavior, and technology supports both.<\/p>\n<\/blockquote>\n<h2>Human aspects vs human factors<\/h2>\n<table>\n<thead>\n<tr>\n<th>Human aspects<\/th>\n<th>Human factors<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>What people do<\/strong>: actions, habits, awareness, training, culture and policies.<\/td>\n<td><strong>Why people do it<\/strong>: attention, stress, cognitive bias, mental workload, usability and decision-making.<\/td>\n<\/tr>\n<tr>\n<td>Example: staff often reuse passwords.<\/td>\n<td>Explanation: remembering many passwords is difficult, and convenience wins.<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>The <strong>People–Process–Technology (PPT)<\/strong> model connects employees, managers, students, contractors, customers and admins (<strong>people<\/strong>) with policies, incident plans, access procedures and risk processes (<strong>process<\/strong>) and firewalls, encryption, MFA, antivirus, IDS and monitoring (<strong>technology<\/strong>).<\/p>\n<div class=\"three-grid\"><div class=\"mini-tile\"><strong>People<\/strong><span>Learn • decide • report<\/span><\/div><div class=\"mini-tile\"><strong>Process<\/strong><span>Rules • responsibilities • review<\/span><\/div><div class=\"mini-tile\"><strong>Technology<\/strong><span>Detect • enforce • protect<\/span><\/div><\/div>\n<blockquote>\n<p><strong>Why PPT matters<\/strong> · An employee might see a phishing email (<strong>people<\/strong>), follow the reporting guide (<strong>process<\/strong>), and rely on email filtering plus MFA (<strong>technology<\/strong>). One pillar alone is weaker than the three working together.<\/p>\n<\/blockquote>\n<p><strong>Source:<\/strong> Human factors, slides 2–5.<\/p>\n<h2>Why people become security risks<\/h2>\n<p>Common causes from the lecture: <strong>lack of awareness<\/strong>, <strong>negligence<\/strong>, <strong>convenience<\/strong>, <strong>curiosity<\/strong>, <strong>trust<\/strong>, and <strong>stress/time pressure<\/strong>. Examples: ignoring updates, sharing passwords, installing unknown software, or approving a suspicious request in a hurry.<\/p>\n<p>Attackers often appeal to:<\/p>\n<table>\n<thead>\n<tr>\n<th>Psychological trigger<\/th>\n<th>Simple example<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>Authority<\/strong><\/td>\n<td>“I am your IT administrator.”<\/td>\n<\/tr>\n<tr>\n<td><strong>Urgency<\/strong><\/td>\n<td>“Respond within 10 minutes.”<\/td>\n<\/tr>\n<tr>\n<td><strong>Fear<\/strong><\/td>\n<td>“Your account will be closed.”<\/td>\n<\/tr>\n<tr>\n<td><strong>Curiosity<\/strong><\/td>\n<td>“Open this unusual attachment.”<\/td>\n<\/tr>\n<tr>\n<td><strong>Greed / reward<\/strong><\/td>\n<td>“You won a prize.”<\/td>\n<\/tr>\n<tr>\n<td><strong>Sympathy<\/strong><\/td>\n<td>A fabricated emergency requesting help.<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<blockquote>\n<p><strong>Tricky point<\/strong> · These are not six technical vulnerabilities. They are <strong>persuasion triggers<\/strong>. An attacker may combine several in one message. For example, fake authority + fear + urgency.<\/p>\n<\/blockquote>\n<p><strong>Source:<\/strong> Human factors, slides 6–8.<\/p>\n<h2>Human error, violation and insider threat<\/h2>\n<ul>\n<li><strong>Error<\/strong> = unintentional mistake: wrong email recipient, deleted file, misconfigured cloud folder, lost device.<\/li>\n<li><strong>Violation<\/strong> = intentional failure to follow a rule: knowingly sharing passwords, bypassing a restriction, installing prohibited software.<\/li>\n<li><strong>Malicious insider<\/strong> = deliberately causes harm using trusted access.<\/li>\n<li><strong>Negligent insider<\/strong> = accidentally exposes information or ignores safe practices.<\/li>\n<li><strong>Compromised insider<\/strong> = an outside attacker uses the insider's stolen credentials.<\/li>\n<\/ul>\n<blockquote>\n<p><strong>Extra explanation<\/strong> · Intent is the deciding factor between an <strong>error<\/strong> and a <strong>violation<\/strong>. A compromised account may act like an insider even though the real employee did not approve those actions.<\/p>\n<\/blockquote>\n<p><strong>Source:<\/strong> Human factors, slides 9–11.<\/p>\n<h2>Social engineering methods<\/h2>\n<table>\n<thead>\n<tr>\n<th>Method<\/th>\n<th>What happens<\/th>\n<th>Defensive habit<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>Phishing<\/strong><\/td>\n<td>Fake email, message, or site requests data or action.<\/td>\n<td>Verify through a trusted channel.<\/td>\n<\/tr>\n<tr>\n<td><strong>Baiting<\/strong><\/td>\n<td>Tempting free download or unknown USB device.<\/td>\n<td>Do not use untrusted files or devices.<\/td>\n<\/tr>\n<tr>\n<td><strong>Tailgating / piggybacking<\/strong><\/td>\n<td>Someone follows authorized staff into a restricted area.<\/td>\n<td>Follow visitor and access rules.<\/td>\n<\/tr>\n<tr>\n<td><strong>Shoulder surfing<\/strong><\/td>\n<td>Someone watches sensitive information being entered.<\/td>\n<td>Shield screens and input.<\/td>\n<\/tr>\n<tr>\n<td><strong>Dumpster diving<\/strong><\/td>\n<td>Sensitive discarded material is collected.<\/td>\n<td>Secure disposal and shredding.<\/td>\n<\/tr>\n<tr>\n<td><strong>Deepfake impersonation<\/strong><\/td>\n<td>Synthetic voice, video or image imitates someone trusted.<\/td>\n<td>Verify unexpected requests independently.<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>Social engineering<\/strong> means manipulating people into disclosing data or doing an unsafe action. It can happen online, over the phone, or in physical places.<\/p>\n<p><strong>Source:<\/strong> Human factors, slides 16–17.<\/p>\n<h2>Awareness, hygiene and security culture<\/h2>\n<p><strong>Security awareness<\/strong> teaches people to recognize risk, make safer choices, and report concerns. <strong>Security hygiene<\/strong> means daily habits that reduce risk: strong unique passwords, MFA, timely updates, locking devices, verifying senders, backing up data, avoiding untrusted networks for sensitive work without appropriate protection, and reporting suspicious activity.<\/p>\n<p><strong>Security culture<\/strong> is the shared attitude toward security. Good culture makes reporting easy, does not punish honest early reporting, and assigns responsibility across the organization.<\/p>\n<p><strong>Human Risk Management (HRM)<\/strong> identifies and measures human-related risks using signals such as phishing susceptibility, password practices, access privileges, awareness assessments, insider indicators, and behavior analytics. Such monitoring must also respect privacy and fairness.<\/p>\n<p><strong>Human-centered security design<\/strong> makes the safe action the easy action: clear warnings, sensible defaults, usable MFA, simple reporting, and not overwhelming users with alerts.<\/p>\n<p><strong>Source:<\/strong> Human factors, slides 12–19.<\/p>\n"},{"num":"03","slug":"endpoints","title":"Endpoint and network defenses","short":"Endpoint protection","category":"Security essentials","description":"Host firewalls, malware detection, HIDS, network defense, attack surfaces, BYOD and sandboxes.","sections":5,"minutes":4,"html":"<blockquote>\n<p><strong>Core idea<\/strong> · An endpoint is any network-connected host: laptop, server, printer, phone, IP camera, controller, smart appliance, or IoT device. Every endpoint increases the area that needs protection.<\/p>\n<\/blockquote>\n<h2>Perimeter and internal network<\/h2>\n<p>A <strong>network perimeter<\/strong> separates a managed network from external networks. Controls may include routers, VPN gateways, firewalls, <strong>IPS<\/strong> (intrusion prevention), and <strong>AAA<\/strong> services (<strong>authentication, authorization, accounting<\/strong>). The lecture introduces <strong>Cisco ASA<\/strong> (Adaptive Security Appliance) as an example of a security appliance combining several network-defense features.<\/p>\n<div class=\"diagram-flow\"><span>Internet<\/span><b>→<\/b><span>VPN / Firewall<\/span><b>→<\/b><span>IPS / Switches<\/span><b>→<\/b><span>Internal devices<\/span><\/div>\n<p><strong>Why protect the LAN too?<\/strong> An attacker who compromises one internal laptop might try to reach servers or other systems. Network infrastructure such as switches, wireless devices and IP phones also needs protection. The slides mention MAC-table overflow, spoofing, DHCP-related threats, LAN storms, STP manipulation and VLAN attacks.<\/p>\n<blockquote>\n<p><strong>Extra explanation<\/strong> · A <strong>VPN<\/strong> creates an encrypted tunnel over another network. A <strong>firewall<\/strong> decides which network traffic is allowed. An <strong>IDS<\/strong> detects suspicious activity; an <strong>IPS<\/strong> may actively block it. <strong>AAA<\/strong> combines identity checking, permission checks and activity accounting.<\/p>\n<\/blockquote>\n<p><strong>Source:<\/strong> Endpoint threats, slides 2–7.<\/p>\n<h2>Host-based protection<\/h2>\n<p><strong>Antivirus / antimalware<\/strong> runs on an endpoint and looks for malicious software using three broad methods:<\/p>\n<table>\n<thead>\n<tr>\n<th>Method<\/th>\n<th>How it works<\/th>\n<th>Limitation<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>Signature-based<\/strong><\/td>\n<td>Compare against known malicious patterns.<\/td>\n<td>New or changed malware may not match.<\/td>\n<\/tr>\n<tr>\n<td><strong>Heuristic-based<\/strong><\/td>\n<td>Look for suspicious general features.<\/td>\n<td>May produce false alarms.<\/td>\n<\/tr>\n<tr>\n<td><strong>Behavior-based<\/strong><\/td>\n<td>Observe suspicious actions and patterns.<\/td>\n<td>Needs good context to distinguish normal use.<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>Host-based firewalls<\/strong> apply network connection rules on a device. Windows Firewall has profiles such as Public, Private, and Domain. In Linux, <strong>iptables<\/strong> configures rules through Netfilter; <strong>nftables<\/strong> is the newer framework and management tool. <strong>TCP Wrapper<\/strong> is a historical service-level access-control mechanism.<\/p>\n<p><strong>Host security suites<\/strong> may bundle antimalware, anti-phishing, web protection, host intrusion prevention, firewalls, and centralized logs. Logs can be forwarded to security monitoring teams.<\/p>\n<p><strong>Source:<\/strong> Endpoint threats, slides 8–13.<\/p>\n<h2>Network-level protection and NAC<\/h2>\n<p><strong>Network-based defense<\/strong> filters threats before they reach an endpoint or before endpoints can reach unsafe destinations. Lecture examples include:<\/p>\n<ul>\n<li><strong>AMP<\/strong>: advanced malware protection across endpoints or services.<\/li>\n<li><strong>ESA<\/strong>: email security appliance; filters spam and risky messages.<\/li>\n<li><strong>WSA<\/strong>: web security appliance; controls access to unsafe sites or disallowed services.<\/li>\n<li><strong>NAC (Network Admission Control)<\/strong>: checks whether a device or user is allowed and meets network access requirements.<\/li>\n<\/ul>\n<p><strong>NAC example:<\/strong> A device without required security updates may be placed in a restricted network rather than receiving full access.<\/p>\n<p><strong>Source:<\/strong> Endpoint threats, slides 14–15.<\/p>\n<h2>HIDS, HIPS and detection styles<\/h2>\n<p><strong>HIDS<\/strong> = Host-based Intrusion Detection System. It may monitor logs, application activity, system configuration, file integrity, rootkit indicators, or suspicious events. <strong>HIPS<\/strong> adds prevention actions. Some products provide both, which is why the labels can overlap.<\/p>\n<table>\n<thead>\n<tr>\n<th>Technique<\/th>\n<th>What it compares<\/th>\n<th>Common problem<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>Signature<\/strong><\/td>\n<td>Activity against known bad patterns.<\/td>\n<td>Zero-day and changing malware.<\/td>\n<\/tr>\n<tr>\n<td><strong>Anomaly-based<\/strong><\/td>\n<td>Behavior against a normal baseline.<\/td>\n<td>False positives when normal usage changes.<\/td>\n<\/tr>\n<tr>\n<td><strong>Policy-based<\/strong><\/td>\n<td>Behavior against predefined permitted/forbidden rules.<\/td>\n<td>Poor rules can be too strict or too loose.<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>Polymorphic malware<\/strong> changes parts of its code or representation so that a simple signature is less reliable. <strong>Zero-day<\/strong> means a previously unknown or unpatched vulnerability is being exploited, not necessarily that malware appeared literally today.<\/p>\n<blockquote>\n<p><strong>Key comparison<\/strong> · <strong>Detection<\/strong> raises an alert. <strong>Prevention<\/strong> attempts to block an action. A system can do both, but detection does not automatically imply successful blocking.<\/p>\n<\/blockquote>\n<p><strong>Source:<\/strong> Endpoint threats, slides 16–20.<\/p>\n<h2>Attack surface, BYOD and application control<\/h2>\n<p>An <strong>attack surface<\/strong> is the collection of possible entry points exposed to an attacker. The slides divide it into:<\/p>\n<ul>\n<li><strong>Network attack surface<\/strong>: exposed network services, protocols, ports, wired and wireless connectivity.<\/li>\n<li><strong>Software attack surface<\/strong>: vulnerable apps, browser services, cloud apps, and installed software.<\/li>\n<li><strong>Human attack surface<\/strong>: insecure habits, errors, and social engineering opportunities.<\/li>\n<\/ul>\n<p><strong>BYOD<\/strong> means <em>Bring Your Own Device<\/em>: workers use personal laptops, tablets, or phones for work. Benefits include convenience; risks include unpatched devices, mixing personal and work data, and weaker organization control.<\/p>\n<p><strong>Blacklisting / denylisting<\/strong> blocks named prohibited apps. <strong>Whitelisting / allowlisting<\/strong> permits only approved apps. Allowlisting can reduce risk, but needs careful management.<\/p>\n<p><strong>Sandboxing<\/strong> runs or observes suspicious software in an isolated environment to learn its behavior and limit damage. <strong>Isolation is not a guarantee<\/strong>; badly configured sandboxes can be escaped, and unknown files should only be handled in a controlled environment.<\/p>\n<p><strong>Source:<\/strong> Endpoint threats, slides 21–25.<\/p>\n"},{"num":"04","slug":"crypto-basics","title":"Cryptography basics and classical ciphers","short":"Crypto foundations","category":"Cryptography","description":"Encryption ideas, Caesar, Vigenère, one-time pads, substitution, transposition, and modes.","sections":7,"minutes":6,"html":"<blockquote>\n<p><strong>Core idea<\/strong> · Cryptography uses algorithms and keys to protect information. Good algorithms should stay secure even when the attacker knows how the algorithm works.<\/p>\n<\/blockquote>\n<h2>Cryptography terms and goals<\/h2>\n<p><strong>Cryptography<\/strong> constructs methods to protect information. <strong>Cryptanalysis<\/strong> studies ways to defeat or analyze those protections. <strong>Cryptology<\/strong> includes both.<\/p>\n<table>\n<thead>\n<tr>\n<th>Term<\/th>\n<th>Meaning<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>Plaintext (P)<\/strong><\/td>\n<td>Original readable message.<\/td>\n<\/tr>\n<tr>\n<td><strong>Ciphertext (C)<\/strong><\/td>\n<td>Encrypted result.<\/td>\n<\/tr>\n<tr>\n<td><strong>Cipher<\/strong><\/td>\n<td>Algorithm for converting plaintext to ciphertext.<\/td>\n<\/tr>\n<tr>\n<td><strong>Encryption / enciphering<\/strong><\/td>\n<td>Transforming plaintext with a key.<\/td>\n<\/tr>\n<tr>\n<td><strong>Decryption / deciphering<\/strong><\/td>\n<td>Recovering plaintext with the correct key.<\/td>\n<\/tr>\n<tr>\n<td><strong>Key (K)<\/strong><\/td>\n<td>Input that controls the cryptographic transformation.<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<div class=\"diagram-flow\"><span>Plaintext<\/span><b>→<\/b><span>Encrypt + key<\/span><b>→<\/b><span>Ciphertext<\/span><b>→<\/b><span>Decrypt + key<\/span><b>→<\/b><span>Plaintext<\/span><\/div>\n<p><strong>Possible cryptographic goals:<\/strong> confidentiality (secrecy), integrity (detect changes), authenticity (check origin), and non-repudiation (strong evidence of a signed action). <strong>Encryption alone<\/strong> does not automatically provide all four goals.<\/p>\n<p><strong>Kerckhoffs' principle:<\/strong> a cryptosystem should remain secure when its design is public; secrecy belongs in the <strong>key<\/strong>, not in an undocumented algorithm. This is why widely reviewed algorithms such as AES can be public.<\/p>\n<p><strong>Source:<\/strong> Cryptography fundamentals, slides 2–13.<\/p>\n<h2>History and two classic transformations<\/h2>\n<p>The lecture mentions ancient Egyptian non-standard hieroglyphs, <strong>Caesar's cipher<\/strong>, alphabet-pair substitution described in the <strong>Kama Sutra<\/strong>, <strong>Enigma<\/strong> during World War II and work at Bletchley Park, the 1976 Diffie–Hellman public-key concept, published RSA work in 1977, and the selection of <strong>Rijndael<\/strong> as AES in 2000.<\/p>\n<ul>\n<li><strong>Substitution<\/strong> replaces a symbol with another symbol. Example: <code>A → D<\/code>.<\/li>\n<li><strong>Transposition<\/strong> changes <strong>positions<\/strong> of symbols without changing which symbols they are.<\/li>\n<li><strong>Steganography<\/strong> hides the <em>existence<\/em> of a message, while encryption hides its <em>meaning<\/em>.<\/li>\n<\/ul>\n<blockquote>\n<p><strong>Memory trick<\/strong> · <strong>Substitution: change the letters. Transposition: move the letters.<\/strong> Both can be combined in more complex ciphers.<\/p>\n<\/blockquote>\n<p><strong>Source:<\/strong> Cryptography fundamentals, slides 5, 14–16, 35.<\/p>\n<h2>Caesar cipher — worked example<\/h2>\n<p>Each English letter is assigned a number from 0 to 25: <code>A=0, B=1, ..., Z=25<\/code>. Shift each letter by a fixed key <strong>k<\/strong>.<\/p>\n<div class=\"formula\">E<sub>k<\/sub>(x) = (x + k) mod 26 &emsp; D<sub>k<\/sub>(y) = (y − k) mod 26<\/div>\n<p>With <strong>k = 3<\/strong>, <code>A → D<\/code>, <code>B → E<\/code> and <code>Z → C<\/code> (wrap around after Z). <strong>HELLO → KHOOR<\/strong>.<\/p>\n<div class=\"tool-panel\"><div class=\"tool-head\"><strong>Try the Caesar cipher<\/strong><span class=\"badge\">Interactive example<\/span><\/div><label for=\"caesarInput\">Message<\/label><input id=\"caesarInput\" value=\"HELLO WORLD\" maxlength=\"120\" /><label for=\"caesarShift\">Shift <output id=\"shiftOut\">3<\/output><\/label><input id=\"caesarShift\" type=\"range\" min=\"0\" max=\"25\" value=\"3\" /><div class=\"result-card\" id=\"caesarOutput\">KHOOR ZRUOG<\/div><small>This is a learning toy. Caesar cipher is <strong>not secure<\/strong> for real data.<\/small><\/div>\n<p><strong>Why weak?<\/strong> There are only 26 possible shifts, so trying them all is easy. Letter-frequency patterns also remain visible.<\/p>\n<p><strong>Source:<\/strong> Cryptography fundamentals, slides 17, 20.<\/p>\n<h2>Kama Sutra, monoalphabetic and polyalphabetic substitution<\/h2>\n<p>The <strong>Kama Sutra alphabet-pair cipher<\/strong> in the slides arranges a shuffled alphabet as two equal rows of 13 letters. Replace a character with the one in the <strong>same column, opposite row<\/strong>. Because the pairs swap both ways, the same operation reverses it. It is a <strong>monoalphabetic substitution<\/strong>: each letter always maps to the same partner.<\/p>\n<p>A <strong>monoalphabetic cipher<\/strong> always uses one substitution alphabet. Attackers may use frequency analysis because repeated letters and characteristic frequencies remain visible.<\/p>\n<p>A <strong>polyalphabetic cipher<\/strong> switches between multiple substitution alphabets. In a <strong>Vigenère cipher<\/strong>, a keyword chooses a shift for each position. For example, using the repeating key <code>KEY<\/code>, letters use shifts K=10, E=4, Y=24, then K again. It hides single-letter frequencies better than a fixed substitution but is not modern secure encryption.<\/p>\n<p>The lecture also has an odd/even-position example: use one substitution table for odd character positions and a different table for even positions. The principle is <strong>the position selects the alphabet<\/strong>.<\/p>\n<blockquote>\n<p><strong>Slide caution<\/strong> · The printed odd/even example appears to have duplicated outputs in its substitution rows, so it is not a clean one-to-one substitution alphabet. Learn the <strong>two-alphabet method<\/strong>, not a possibly misprinted mapping.<\/p>\n<\/blockquote>\n<p><strong>Source:<\/strong> Cryptography fundamentals, slides 18–24.<\/p>\n<h2>Columnar transposition<\/h2>\n<p>Write a message in a grid of a chosen width; then read down columns instead of across rows. Example with width 4 and text <code>ATTACKATDAWN<\/code>:<\/p>\n<div class=\"mono-grid\">A T T A<br>C K A T<br>D A W N<\/div>\n<p>Reading downward, left to right: <code>ACD TKA TAW ATN<\/code> (spaces shown only to separate columns). The symbols are unchanged; only their order has moved. A proper columnar transposition may use a keyword to reorder columns.<\/p>\n<p><strong>Source:<\/strong> Cryptography fundamentals, slide 25.<\/p>\n<h2>One-time pad (OTP) / Vernam cipher<\/h2>\n<p>In a <strong>one-time pad<\/strong>, a truly random secret key is as long as the message, used only once, and kept secret. For binary data:<\/p>\n<div class=\"formula\">C = P ⊕ K &emsp;&emsp; P = C ⊕ K<\/div>\n<p><code>⊕<\/code> means <strong>XOR<\/strong>. Example: <code>1011 ⊕ 1100 = 0111<\/code>, and <code>0111 ⊕ 1100 = 1011<\/code>. For alphabetic examples, addition modulo 26 can be used instead.<\/p>\n<p><strong>Why is it special?<\/strong> Under the strict conditions (uniform truly random key, same length as data, secret, never reused), it provides <strong>perfect secrecy<\/strong>. But distributing, storing and protecting huge secret keys is hard. A key repeated across messages breaks this guarantee.<\/p>\n<p><strong>True randomness<\/strong> comes from physical entropy sources; a <strong>pseudorandom generator<\/strong> uses a deterministic algorithm and a seed. Cryptographically secure pseudorandom generators can be unpredictable in practice, but their output is not a mathematical one-time pad unless the key meets the one-time-pad requirements.<\/p>\n<p><strong>Source:<\/strong> Cryptography fundamentals, slides 26–30.<\/p>\n<h2>Block ciphers, stream ciphers and modes<\/h2>\n<table>\n<thead>\n<tr>\n<th>Block cipher<\/th>\n<th>Stream cipher<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Processes fixed-size blocks (for example, AES uses 128-bit blocks).<\/td>\n<td>Produces a keystream and combines it with data.<\/td>\n<\/tr>\n<tr>\n<td>Examples: AES, DES, 3DES, Blowfish, IDEA.<\/td>\n<td>Examples from notes: RC4, SEAL; modern example: ChaCha20.<\/td>\n<\/tr>\n<tr>\n<td>Needs a mode to encrypt messages longer than one block.<\/td>\n<td>Keystream/nonce reuse can be extremely dangerous.<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>Modes listed in your slides:<\/strong><\/p>\n<table>\n<thead>\n<tr>\n<th>Mode<\/th>\n<th>Idea<\/th>\n<th>Important catch<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>ECB<\/strong><\/td>\n<td>Encrypt each block independently.<\/td>\n<td>Repeated plaintext blocks can reveal patterns.<\/td>\n<\/tr>\n<tr>\n<td><strong>CBC<\/strong><\/td>\n<td>Mix each block with previous ciphertext; start with an IV.<\/td>\n<td>Needs suitable padding and separate integrity protection.<\/td>\n<\/tr>\n<tr>\n<td><strong>CFB<\/strong><\/td>\n<td>Use block cipher output to process stream-like data.<\/td>\n<td>Proper IV handling matters.<\/td>\n<\/tr>\n<tr>\n<td><strong>OFB<\/strong><\/td>\n<td>Generate a keystream using repeated encryption.<\/td>\n<td>Never repeat the keystream with the same key.<\/td>\n<\/tr>\n<tr>\n<td><strong>CTR<\/strong><\/td>\n<td>Encrypt changing counters to generate a keystream.<\/td>\n<td>Never repeat the same nonce/counter under a key.<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>Modern extension:<\/strong> <strong>AES-GCM<\/strong> is an authenticated-encryption mode. It can protect both confidentiality and integrity/authenticity of a message when used correctly. Plain ECB/CBC alone do not automatically authenticate the data.<\/p>\n<p><strong>Source:<\/strong> Cryptography fundamentals, slides 31–34. The AES-GCM explanation is extra context.<\/p>\n"},{"num":"05","slug":"math","title":"Number theory for cryptography","short":"Crypto mathematics","category":"Cryptography","description":"Identity, inverses, primes, GCD, Euclidean algorithm, Fermat and Euler’s theorem.","sections":6,"minutes":4,"html":"<blockquote>\n<p><strong>Core idea<\/strong> · RSA uses arithmetic done <strong>modulo n<\/strong>. The difficult-looking equations become much easier once you understand remainder, greatest common divisor, and modular inverse.<\/p>\n<\/blockquote>\n<h2>Identity and inverse<\/h2>\n<p>An <strong>identity element<\/strong> leaves an operand unchanged: for addition it is <strong>0<\/strong>, because <code>x + 0 = x<\/code>; for multiplication it is <strong>1<\/strong>, because <code>x × 1 = x<\/code>.<\/p>\n<p>An <strong>inverse<\/strong> reverses an operation to get the identity. Under addition, the inverse of <code>a<\/code> is <code>−a<\/code> because <code>a + (−a) = 0<\/code>. Under ordinary multiplication, the inverse of nonzero <code>a<\/code> is <code>1/a<\/code> because <code>a × (1/a) = 1<\/code>.<\/p>\n<blockquote>\n<p><strong>Don't confuse them<\/strong> · The identity belongs to the <strong>operation<\/strong> (such as 0 for addition). An inverse belongs to a <strong>specific element under that operation<\/strong> (such as −7 for 7 under addition).<\/p>\n<\/blockquote>\n<p><strong>Source:<\/strong> Arithmetic properties, slides 2–3.<\/p>\n<h2>Primes, factorization and relatively prime numbers<\/h2>\n<p>A <strong>prime<\/strong> integer greater than 1 has exactly two positive divisors: <strong>1 and itself<\/strong>. <code>2, 3, 5, 7, 11, ...<\/code> are prime; <strong>1 is not prime<\/strong>. Every integer greater than 1 has a unique factorization into primes (up to order).<\/p>\n<p>Examples: <code>91 = 7 × 13<\/code> and <code>3600 = 2⁴ × 3² × 5²<\/code>.<\/p>\n<p>The <strong>greatest common divisor<\/strong>, <code>gcd(a,b)<\/code>, is the largest positive integer that divides both. Two numbers are <strong>coprime / relatively prime<\/strong> when <code>gcd(a,b) = 1<\/code>, even if neither number is itself prime. Example: <code>8<\/code> and <code>15<\/code> are coprime.<\/p>\n<p>For factorizations, take each <strong>shared<\/strong> prime with the <strong>smaller exponent<\/strong>. Example: <code>300 = 2² × 3 × 5²<\/code> and <code>18 = 2 × 3²<\/code>, so <code>gcd(300,18)=2×3=6<\/code>.<\/p>\n<p><strong>Source:<\/strong> Arithmetic properties, slides 4–6, 11.<\/p>\n<h2>Modulo and Euclidean algorithm<\/h2>\n<p><code>a mod n<\/code> means the remainder after dividing <code>a<\/code> by <code>n<\/code>. For example, <code>17 mod 5 = 2<\/code>. The symbol <code>a ≡ b (mod n)<\/code> says that <code>a<\/code> and <code>b<\/code> have the <strong>same remainder modulo n<\/strong>.<\/p>\n<p>The <strong>Euclidean algorithm<\/strong> uses:<\/p>\n<div class=\"formula\">gcd(a,b) = gcd(b, a mod b)<\/div>\n<p>Repeat until the remainder is zero. The <strong>last nonzero remainder<\/strong> is the GCD.<\/p>\n<p><strong>Worked example: <code>gcd(252,105)<\/code><\/strong>:<\/p>\n<div class=\"step-stack\"><div><em>1<\/em><span>252 = 2 × 105 + 42<\/span><\/div><div><em>2<\/em><span>105 = 2 × 42 + 21<\/span><\/div><div><em>3<\/em><span>42 = 2 × 21 + 0<\/span><\/div><\/div>\n<p>Result: <strong>gcd(252,105) = 21<\/strong>. Why? Replacing the larger number with its remainder does not change the set of common divisors.<\/p>\n<div class=\"tool-panel\"><div class=\"tool-head\"><strong>Explore the Euclidean algorithm<\/strong><span class=\"badge\">Interactive<\/span><\/div><div class=\"input-row\"><label>First number <input id=\"gcdA\" type=\"number\" value=\"1970\" min=\"1\" max=\"1000000000\"><\/label><label>Second number <input id=\"gcdB\" type=\"number\" value=\"1066\" min=\"1\" max=\"1000000000\"><\/label><\/div><button type=\"button\" class=\"tool-button\" id=\"gcdRun\">Show the steps<\/button><pre class=\"tool-result\" id=\"gcdResult\"><\/pre><\/div>\n<p><strong>Source:<\/strong> Arithmetic properties, slides 5–8.<\/p>\n<h2>Modular multiplicative inverse<\/h2>\n<p>A number <code>d<\/code> is the inverse of <code>e<\/code> <strong>modulo m<\/strong> when:<\/p>\n<div class=\"formula\">e × d ≡ 1 (mod m)<\/div>\n<p>For example, <code>3 × 2 = 6 ≡ 1 (mod 5)<\/code>, so <strong>the modular inverse of 3 modulo 5 is 2<\/strong>. This is <em>not<\/em> the ordinary fraction 1/3.<\/p>\n<p>A modular inverse of <code>e (mod m)<\/code> exists <strong>exactly when<\/strong> <code>gcd(e,m)=1<\/code>. In RSA, the private exponent <code>d<\/code> is chosen as the modular inverse of public exponent <code>e<\/code> modulo <code>φ(n)<\/code> (or an equivalent valid construction).<\/p>\n<blockquote>\n<p><strong>Why can an inverse fail?<\/strong> · <code>2<\/code> has no inverse modulo <code>6<\/code>: multiplying 2 by any integer gives an even number, and no even number is 1 modulo 6. This is why RSA checks that <code>e<\/code> and <code>φ(n)<\/code> are coprime.<\/p>\n<\/blockquote>\n<p><strong>Source:<\/strong> Arithmetic properties, slides 2–3, 9–10; RSA lecture, slides 19–21. Existence criterion is extra explanation.<\/p>\n<h2>Fermat's little theorem<\/h2>\n<p>For prime <strong>p<\/strong> and integer <strong>a<\/strong> not divisible by p:<\/p>\n<div class=\"formula\">a<sup>p−1<\/sup> ≡ 1 (mod p)<\/div>\n<p>Also for every integer a, <strong>a<sup>p<\/sup> ≡ a (mod p)<\/strong> when p is prime. From Fermat, the modular inverse of a modulo prime p is <strong>a<sup>p−2<\/sup> (mod p)<\/strong> when <code>a mod p ≠ 0<\/code>.<\/p>\n<p>Example: inverse of <code>3 mod 5<\/code> is <code>3³ mod 5 = 27 mod 5 = 2<\/code>.<\/p>\n<p><strong>Why the condition?<\/strong> If <code>a<\/code> is divisible by p, it becomes 0 modulo p, and 0 has no multiplicative inverse.<\/p>\n<p><strong>Source:<\/strong> Arithmetic properties, slides 9–10.<\/p>\n<h2>Euler's totient and theorem<\/h2>\n<p><strong>Euler's totient function <code>φ(n)<\/code><\/strong> counts positive integers less than n that are coprime with n.<\/p>\n<ul>\n<li>If <strong>p<\/strong> is prime, <code>φ(p)=p−1<\/code>. Every integer 1 through p−1 is coprime with p.<\/li>\n<li>If <strong>p and q are distinct primes<\/strong>, <code>φ(pq)=(p−1)(q−1)<\/code>.<\/li>\n<li>Example: <code>φ(15)=φ(3×5)=(2)(4)=8<\/code>. The coprimes below 15 are <code>1,2,4,7,8,11,13,14<\/code>.<\/li>\n<\/ul>\n<p><strong>Euler's theorem<\/strong> says when <code>gcd(a,n)=1<\/code>:<\/p>\n<div class=\"formula\">a<sup>φ(n)<\/sup> ≡ 1 (mod n)<\/div>\n<p>This connects to RSA: we choose <code>e × d ≡ 1 (mod φ(n))<\/code>. Under RSA's number-theory setup, raising a message to <code>e<\/code> and then <code>d<\/code> recovers that message modulo n.<\/p>\n<p><strong>Source:<\/strong> Arithmetic properties, slide 12; RSA lecture, slides 19–21.<\/p>\n"},{"num":"06","slug":"symmetric","title":"Symmetric encryption algorithms","short":"Symmetric encryption","category":"Cryptography","description":"DES, 3DES, AES, RC family, SEAL, block ciphers and key management.","sections":5,"minutes":5,"html":"<blockquote>\n<p><strong>Core idea<\/strong> · Symmetric encryption uses <strong>the same shared secret key<\/strong> for encryption and decryption. It is efficient for large amounts of data, but safely sharing and managing keys is a major challenge.<\/p>\n<\/blockquote>\n<h2>How symmetric encryption works<\/h2>\n<div class=\"diagram-flow\"><span>Plaintext X<\/span><b>+<\/b><span>Secret key K<\/span><b>→<\/b><span>E<sub>K<\/sub>(X) = Y<\/span><b>→<\/b><span>D<sub>K<\/sub>(Y) = X<\/span><\/div>\n<p>The lecture calls it <strong>secret-key<\/strong> or sometimes <strong>private-key<\/strong> cryptography. Be careful: &quot;private key&quot; is also the name of one half of an <strong>asymmetric<\/strong> key pair. <strong>Shared secret key<\/strong> is clearer here.<\/p>\n<p><strong>Two basic requirements:<\/strong> use a strong algorithm and keep the key secret from outsiders. The algorithm may be publicly known (Kerckhoffs' principle).<\/p>\n<table>\n<thead>\n<tr>\n<th>Strengths<\/th>\n<th>Challenges<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Fast and efficient for bulk data.<\/td>\n<td>Secret key must reach both parties securely.<\/td>\n<\/tr>\n<tr>\n<td>Long secure keys resist brute force.<\/td>\n<td>Many communicating groups need careful key management.<\/td>\n<\/tr>\n<tr>\n<td>Works well for file/storage/stream protection.<\/td>\n<td>Shared keys do not provide strong individual non-repudiation.<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<blockquote>\n<p><strong>Important nuance<\/strong> · The slides say symmetric encryption only provides confidentiality. <strong>Encryption alone<\/strong> generally does; however, symmetric-key <strong>MACs and authenticated encryption<\/strong> can also provide integrity and shared-key authentication. They still cannot establish individual non-repudiation between two parties that share the same secret.<\/p>\n<\/blockquote>\n<p><strong>Source:<\/strong> Symmetric encryption, slides 2–4.<\/p>\n<h2>DES — Data Encryption Standard<\/h2>\n<p><strong>DES<\/strong> is a symmetric <strong>64-bit block cipher<\/strong>. It uses a 64-bit key representation, but <strong>8 bits are parity bits<\/strong>, leaving <strong>56 effective key bits<\/strong>. It uses multiple rounds of substitutions and permutations.<\/p>\n<p>Why is DES no longer suitable? Its 56-bit key is short enough for brute-force search using specialized hardware. The lecture also discusses a restricted 40-bit-security variant with known key bits, which is weaker still. DES is important historically, <strong>not<\/strong> a good new-system choice.<\/p>\n<p><strong>CBC<\/strong> is the chaining mode mentioned in the slides: encryption of a block depends on the previous ciphertext block and an initial IV. CBC does not by itself prevent malicious modification, so modern use requires correct integrity protection.<\/p>\n<p><strong>Source:<\/strong> Symmetric encryption, slides 5–8.<\/p>\n<h2>Triple DES / 3DES / TDEA<\/h2>\n<p><strong>3DES<\/strong> applies DES three times to each block. Common <strong>EDE<\/strong> construction:<\/p>\n<div class=\"diagram-flow\"><span>Plaintext<\/span><b>→<\/b><span>DES encrypt K₁<\/span><b>→<\/b><span>DES decrypt K₂<\/span><b>→<\/b><span>DES encrypt K₃<\/span><b>→<\/b><span>Ciphertext<\/span><\/div>\n<p>Three independent 56-bit key components give <strong>168 bits of nominal key material<\/strong>, but the effective general attack security is around <strong>112 bits<\/strong>, not 168. With <strong>K₁ = K₃<\/strong> (two-key 3DES), the key material is 112 bits and effective security is lower than the three-key form. EDE also supports backward compatibility with single DES when all three keys match.<\/p>\n<blockquote>\n<p><strong>Modern correction<\/strong> · The lecture describes 3DES as trustworthy and describes 168-bit &quot;effective&quot; strength. NIST withdrew its TDEA specification on <strong>1 January 2024<\/strong>, and new encryption with 3DES is not NIST-approved. Learn EDE for the <strong>exam<\/strong>, but choose modern authenticated encryption for new applications. <a href=\"https://csrc.nist.gov/pubs/sp/800/67/r2/final\" target=\"_blank\" rel=\"noopener\">NIST TDEA status ↗<\/a><\/p>\n<\/blockquote>\n<p><strong>Source:<\/strong> Symmetric encryption, slides 9–11.<\/p>\n<h2>AES — Advanced Encryption Standard<\/h2>\n<p><strong>AES<\/strong> was selected from the <strong>Rijndael<\/strong> family after a public competition to replace DES. It was developed by <strong>Joan Daemen<\/strong> and <strong>Vincent Rijmen<\/strong>. AES repeatedly transforms a 128-bit block using a key and several rounds.<\/p>\n<table>\n<thead>\n<tr>\n<th>Algorithm<\/th>\n<th style=\"text-align:right\">Key length<\/th>\n<th style=\"text-align:right\">Block length<\/th>\n<th style=\"text-align:right\">Rounds<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>AES-128<\/td>\n<td style=\"text-align:right\">128 bits<\/td>\n<td style=\"text-align:right\">128 bits<\/td>\n<td style=\"text-align:right\">10<\/td>\n<\/tr>\n<tr>\n<td>AES-192<\/td>\n<td style=\"text-align:right\">192 bits<\/td>\n<td style=\"text-align:right\">128 bits<\/td>\n<td style=\"text-align:right\">12<\/td>\n<\/tr>\n<tr>\n<td>AES-256<\/td>\n<td style=\"text-align:right\">256 bits<\/td>\n<td style=\"text-align:right\">128 bits<\/td>\n<td style=\"text-align:right\">14<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>Why AES replaced DES/3DES:<\/strong> much larger keys, efficient software and hardware implementations, and good performance for data at rest and in transit. AES alone is a <strong>block primitive<\/strong>; a secure application also needs the correct <strong>mode<\/strong>, key handling, and nonce/IV rules. AES-GCM is a common authenticated mode.<\/p>\n<blockquote>\n<p><strong>Slide correction<\/strong> · The slides say AES can have 128/192/256-bit <strong>blocks<\/strong>. That describes the broader Rijndael design, <strong>not the AES standard<\/strong>. <strong>All standardized AES variants have 128-bit blocks.<\/strong> <a href=\"https://www.nist.gov/publications/advanced-encryption-standard-aes-0\" target=\"_blank\" rel=\"noopener\">NIST FIPS 197 (2023 update) ↗<\/a><\/p>\n<\/blockquote>\n<p><strong>Source:<\/strong> Symmetric encryption, slides 12–16.<\/p>\n<h2>SEAL and RC families<\/h2>\n<p>The lecture includes older algorithms mainly for comparison and history:<\/p>\n<table>\n<thead>\n<tr>\n<th>Algorithm<\/th>\n<th>Class<\/th>\n<th>Lecture fact<\/th>\n<th>Current study note<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>SEAL<\/strong><\/td>\n<td>Stream cipher<\/td>\n<td>Rogaway and Coppersmith, 1993; 160-bit key.<\/td>\n<td>Historical algorithm; learn type and purpose.<\/td>\n<\/tr>\n<tr>\n<td><strong>RC2<\/strong><\/td>\n<td>Block cipher<\/td>\n<td>Variable key size; DES alternative.<\/td>\n<td>Legacy.<\/td>\n<\/tr>\n<tr>\n<td><strong>RC4<\/strong><\/td>\n<td>Stream cipher<\/td>\n<td>Variable key; formerly used in WEP and SSL/TLS.<\/td>\n<td><strong>Insecure for modern use<\/strong>; biases and practical weaknesses.<\/td>\n<\/tr>\n<tr>\n<td><strong>RC5<\/strong><\/td>\n<td>Block cipher<\/td>\n<td>Variable block and key sizes.<\/td>\n<td>Historical design.<\/td>\n<\/tr>\n<tr>\n<td><strong>RC6<\/strong><\/td>\n<td>Block cipher<\/td>\n<td>Built on RC5; finalist in AES competition.<\/td>\n<td>Study as an AES finalist, not AES itself.<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>RC<\/strong> refers to a family associated with <strong>Ron Rivest<\/strong>. The name doesn't tell you whether the algorithm is a block or stream cipher: RC4 is a stream cipher, while RC2, RC5 and RC6 are block ciphers.<\/p>\n<blockquote>\n<p><strong>Exam table to memorize<\/strong> · DES = <strong>64-bit block / 56-bit effective key<\/strong>. AES = <strong>128-bit block / 128, 192 or 256-bit key<\/strong>. 3DES = <strong>DES three times, EDE<\/strong>, slower and legacy. RC4 = <strong>legacy stream cipher<\/strong>.<\/p>\n<\/blockquote>\n<p><strong>Source:<\/strong> Symmetric encryption, slides 17–22.<\/p>\n"},{"num":"07","slug":"asymmetric","title":"Public-key cryptography, RSA and signatures","short":"Public-key cryptography","category":"Cryptography","description":"Public/private keys, trapdoor functions, step-by-step RSA, ECC, knapsack, signatures.","sections":8,"minutes":6,"html":"<blockquote>\n<p><strong>Core idea<\/strong> · Public-key systems use <strong>two mathematically related keys<\/strong>. The public key can be shared; the private key stays secret. Different operations use the pair in different ways.<\/p>\n<\/blockquote>\n<h2>Why asymmetric cryptography exists<\/h2>\n<p>In symmetric cryptography, two users must already share a secret. If the shared key leaks, anyone holding it can impersonate either party. Public-key cryptography helps solve <strong>key distribution<\/strong> and enables <strong>digital signatures<\/strong>.<\/p>\n<table>\n<thead>\n<tr>\n<th>Operation<\/th>\n<th>Who uses which key?<\/th>\n<th>Why?<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>Public-key encryption<\/strong><\/td>\n<td>Sender encrypts using <strong>recipient's public key<\/strong>; recipient decrypts with <strong>recipient's private key<\/strong>.<\/td>\n<td>Confidentiality to recipient.<\/td>\n<\/tr>\n<tr>\n<td><strong>Digital signature<\/strong><\/td>\n<td>Sender signs using <strong>sender's private key<\/strong>; verifier checks using <strong>sender's public key<\/strong>.<\/td>\n<td>Authenticity and integrity.<\/td>\n<\/tr>\n<tr>\n<td><strong>Key agreement / exchange<\/strong><\/td>\n<td>Two parties combine public/private operations to establish a shared session key.<\/td>\n<td>Efficient symmetric protection after setup.<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<div class=\"diagram-flow\"><span>Alice's message<\/span><b>→<\/b><span>Bob's public key<\/span><b>→<\/b><span>Encrypted message<\/span><b>→<\/b><span>Bob's private key<\/span><b>→<\/b><span>Readable message<\/span><\/div>\n<p><strong>Common confusion:<\/strong> signing is <strong>not just encrypting with a private key<\/strong>. Secure digital-signature schemes have specific signing and verification rules. Anyone with the public key should be able to verify, not secretly read confidential content.<\/p>\n<p><strong>Source:<\/strong> Public-key encryption, slides 2–8.<\/p>\n<h2>One-way and trapdoor functions<\/h2>\n<p>A <strong>one-way function<\/strong> is easy to compute in the forward direction but hard to reverse. A <strong>trapdoor one-way function<\/strong> becomes easier to reverse if you know special hidden information (the <em>trapdoor<\/em>).<\/p>\n<p>An analogy: multiply two huge primes to get a large integer (<strong>easy<\/strong>), then try to recover the prime factors from the product (<strong>hard<\/strong> for sufficiently well-chosen large numbers using known classical methods). Knowing the factors helps construct the RSA private key.<\/p>\n<p><strong>A public-key system should make it practical<\/strong> to create a key pair, encrypt/verify using the public key, and decrypt/sign with the private key, but impractical to recover private information from the public data.<\/p>\n<p><strong>Source:<\/strong> Public-key encryption, slides 9–12.<\/p>\n<h2>RSA key generation — understand every symbol<\/h2>\n<p>RSA is named after <strong>Rivest, Shamir and Adleman<\/strong>. In a simplified textbook version:<\/p>\n<div class=\"step-stack\"><div><em>1<\/em><span>Choose two <strong>different primes<\/strong> p and q.<\/span><\/div><div><em>2<\/em><span>Compute <strong>n = p × q<\/strong>.<\/span><\/div><div><em>3<\/em><span>Compute <strong>φ(n) = (p − 1)(q − 1)<\/strong>.<\/span><\/div><div><em>4<\/em><span>Choose public exponent <strong>e<\/strong> with <strong>gcd(e,φ(n)) = 1<\/strong>.<\/span><\/div><div><em>5<\/em><span>Find private exponent <strong>d<\/strong> such that <strong>e × d ≡ 1 (mod φ(n))<\/strong>.<\/span><\/div><\/div>\n<div class=\"formula\">Public key = (e, n) &emsp;&emsp; Private key = (d, n)<\/div>\n<div class=\"formula\">Encryption: C = M<sup>e<\/sup> mod n &emsp; Decryption: M = C<sup>d<\/sup> mod n<\/div>\n<p><strong>What is n?<\/strong> The modulus: calculations wrap around at n. <strong>What is e?<\/strong> The public exponent. <strong>What is d?<\/strong> The matching private exponent. <strong>What is φ(n)?<\/strong> The number of positive integers less than n that are coprime with n.<\/p>\n<blockquote>\n<p><strong>Exam reminder<\/strong> · A valid exponent <strong>e does not need to be prime or larger than p and q<\/strong>. The actual requirement here is <code>1 &lt; e &lt; φ(n)<\/code> and <code>gcd(e,φ(n)) = 1<\/code>. Choose an inverse d that makes the modular equation true.<\/p>\n<\/blockquote>\n<p><strong>Source:<\/strong> Public-key encryption, slides 19–21; arithmetic properties, slide 12.<\/p>\n<h2>RSA worked example from the lecture<\/h2>\n<p>The notes choose <strong>p = 11<\/strong>, <strong>q = 17<\/strong>, and <strong>e = 7<\/strong>:<\/p>\n<ol>\n<li><code>n = 11 × 17 = 187<\/code>.<\/li>\n<li><code>φ(n) = 10 × 16 = 160<\/code>.<\/li>\n<li>Check <code>gcd(7,160) = 1<\/code>.<\/li>\n<li>Choose <code>d = 23<\/code>, because <code>7 × 23 = 161 ≡ 1 (mod 160)<\/code>.<\/li>\n<li>Thus public key <strong>(7,187)<\/strong> and private key <strong>(23,187)<\/strong>.<\/li>\n<\/ol>\n<p>Encrypt the lecture message <code>M = 88<\/code>:<\/p>\n<div class=\"formula\">C = 88<sup>7<\/sup> mod 187 = <strong>11<\/strong><\/div>\n<p>One way to avoid enormous numbers is <strong>repeated squaring<\/strong>: <code>88² mod 187 = 77<\/code>, <code>88⁴ mod 187 = 132<\/code>, and <code>88⁷ = 88⁴ × 88² × 88<\/code>, so <code>88⁷ mod 187 = (132 × 77 × 88) mod 187 = 11<\/code>. Decrypting <code>11²³ mod 187<\/code> returns <strong>88<\/strong>.<\/p>\n<div class=\"tool-panel\"><div class=\"tool-head\"><strong>Small RSA calculator<\/strong><span class=\"badge\">Textbook mathematics<\/span><\/div><div class=\"input-row\"><label>Prime p <input id=\"rsaP\" type=\"number\" value=\"11\" min=\"2\" max=\"500\"><\/label><label>Prime q <input id=\"rsaQ\" type=\"number\" value=\"17\" min=\"2\" max=\"500\"><\/label><label>Public e <input id=\"rsaE\" type=\"number\" value=\"7\" min=\"2\" max=\"10000\"><\/label><label>Message M <input id=\"rsaM\" type=\"number\" value=\"88\" min=\"0\" max=\"999999\"><\/label><\/div><button id=\"rsaRun\" type=\"button\" class=\"tool-button\">Calculate key pair and encrypt<\/button><pre class=\"tool-result\" id=\"rsaResult\"><\/pre><small>Uses intentionally tiny numbers for understanding. It is not secure or production RSA. Real RSA encryption requires safe padding such as OAEP.<\/small><\/div>\n<p><strong>Source:<\/strong> Public-key encryption, slides 21–24.<\/p>\n<h2>Merkle–Hellman knapsack (historical)<\/h2>\n<p>The lecture introduces a public-key idea based on <strong>subset sums<\/strong>. Given numbers <code>1, 6, 8, 15, 24<\/code> and a bit vector <code>11110<\/code>, choose numbers whose bits are 1: <code>1 + 6 + 8 + 15 = 30<\/code>. In general:<\/p>\n<div class=\"formula\">Target sum T = b₁w₁ + b₂w₂ + ... + bₙwₙ &emsp; where each bᵢ ∈ {0,1}<\/div>\n<p>The <strong>knapsack optimization problem<\/strong> in general asks for a best selection under a limit, while the <strong>subset-sum version<\/strong> asks which numbers make a particular total. Merkle–Hellman uses a specially structured easy-to-solve private sequence, transformed into a public harder-looking one. The original scheme was broken and is <strong>historical<\/strong>, not recommended modern cryptography.<\/p>\n<p><strong>Source:<\/strong> Public-key encryption, slides 13–17.<\/p>\n<h2>Elliptic curve cryptography (ECC)<\/h2>\n<p>ECC builds public-key systems from mathematical operations on points of a special curve. A common equation shape is:<\/p>\n<div class=\"formula\">y² = x³ + ax + b<\/div>\n<p>In cryptography these calculations are usually performed over a <strong>finite field<\/strong>, not ordinary floating-point graph coordinates. The difficult problem is recovering a secret scalar from the public point created by repeating a point operation.<\/p>\n<p><strong>Why study ECC?<\/strong> It can provide comparable security to classical RSA with much smaller keys, useful for mobile devices and networks. Common uses include <strong>ECDH<\/strong> for key agreement and <strong>ECDSA/EdDSA<\/strong> for signatures. ECC is not simply &quot;encrypt and decrypt faster&quot; in every use case; performance depends on the operation and implementation.<\/p>\n<p><strong>Source:<\/strong> Public-key encryption, slides 29–31. Finite-field details are extra explanation.<\/p>\n<h2>Digital signatures: sign vs verify<\/h2>\n<div class=\"diagram-flow\"><span>Message<\/span><b>→<\/b><span>Hash<\/span><b>→<\/b><span>Sign with private key<\/span><b>→<\/b><span>Signature<\/span><\/div>\n<p>A verifier calculates the message digest and checks the <strong>signature with the signer's public key<\/strong>. If verification succeeds, the message matches the signature and the signing key was used (subject to the key and algorithm being trustworthy).<\/p>\n<p><strong>Digital signatures are different from encryption:<\/strong> signatures usually <strong>do not hide<\/strong> the message. They mainly provide integrity and authentication evidence. Certificates/PKI connect public keys to identities.<\/p>\n<p><strong>Source:<\/strong> Public-key encryption, slides 6–8 and 28; PKI lecture.<\/p>\n<h2>Quantum cryptography — scope of the lecture<\/h2>\n<p>The slides introduce using <strong>quantum properties of photons<\/strong> to support secure key distribution. A common example is <strong>quantum key distribution (QKD)<\/strong>, where measurement can disturb transmitted quantum states and help detect eavesdropping under the protocol assumptions.<\/p>\n<blockquote>\n<p><strong>Extra clarification<\/strong> · Quantum cryptography is <strong>not automatically hack-proof<\/strong>. QKD has practical device, authentication and implementation limitations. It is different from <strong>post-quantum cryptography<\/strong>, which uses mathematical algorithms designed to resist attacks by quantum computers on ordinary classical devices.<\/p>\n<\/blockquote>\n<p><strong>Source:<\/strong> Public-key encryption, slides 32–34.<\/p>\n"},{"num":"08","slug":"pki","title":"Public Key Infrastructure (PKI)","short":"PKI and certificates","category":"Cryptography","description":"Digital certificates, certificate authorities, trust chains, topologies, TLS and revocation.","sections":5,"minutes":3,"html":"<blockquote>\n<p><strong>Core idea<\/strong> · A public key is useful only if you know <strong>whose key it is<\/strong>. PKI uses certificates and trusted authorities to bind identities to public keys.<\/p>\n<\/blockquote>\n<h2>What PKI provides<\/h2>\n<p><strong>Public Key Infrastructure (PKI)<\/strong> is the set of services, roles, policies, certificates, keys, and procedures used to manage public-key trust at scale. The slides list these functions: <strong>create<\/strong>, <strong>issue/distribute<\/strong>, <strong>sign<\/strong>, <strong>validate<\/strong>, and <strong>revoke<\/strong> digital certificates.<\/p>\n<table>\n<thead>\n<tr>\n<th>Component<\/th>\n<th>Job<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>Public/private key pair<\/strong><\/td>\n<td>Enables public-key encryption or signatures.<\/td>\n<\/tr>\n<tr>\n<td><strong>Digital certificate<\/strong><\/td>\n<td>Links an identity or name to a public key.<\/td>\n<\/tr>\n<tr>\n<td><strong>Certificate Authority (CA)<\/strong><\/td>\n<td>Signs certificates after the required verification.<\/td>\n<\/tr>\n<tr>\n<td><strong>Trust store / root CA<\/strong><\/td>\n<td>A set of trusted root certificates held by a browser or operating system.<\/td>\n<\/tr>\n<tr>\n<td><strong>Certificate status<\/strong><\/td>\n<td>Indicates expiration or whether a certificate was revoked.<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>Source:<\/strong> PKI, slides 2–3, 6–10.<\/p>\n<h2>Certificate contents and trust chain<\/h2>\n<p>A typical certificate can include <strong>subject/hostname<\/strong>, <strong>issuer/CA<\/strong>, <strong>serial number<\/strong>, <strong>public key<\/strong>, <strong>validity dates<\/strong>, <strong>allowed key usages<\/strong>, <strong>signature algorithm<\/strong> and <strong>CA signature<\/strong>. Today's web certificates commonly follow the <strong>X.509<\/strong> format.<\/p>\n<div class=\"trust-tree\"><div class=\"trust-root\">Trusted root CA<\/div><div class=\"trust-line\"><\/div><div class=\"trust-mid\">Intermediate CA<\/div><div class=\"trust-line\"><\/div><div class=\"trust-leaf\">Website certificate · example.org<\/div><\/div>\n<p><strong>How trust works:<\/strong> the website shows its certificate and usually intermediate certificates. The browser verifies signatures, checks the hostname and dates, considers revocation/status as applicable, and links the chain to a root it already trusts. The <strong>CA's private key<\/strong> signs the certificate; the CA's <strong>public key<\/strong> verifies it.<\/p>\n<blockquote>\n<p><strong>Tricky point<\/strong> · A certificate is <strong>not a private key<\/strong>. It contains a <strong>public key<\/strong>, claims about the subject, and a CA signature. The website must separately protect the matching private key.<\/p>\n<\/blockquote>\n<p><strong>Source:<\/strong> PKI, slides 8–10.<\/p>\n<h2>PKI topologies<\/h2>\n<table>\n<thead>\n<tr>\n<th>Topology<\/th>\n<th>Structure<\/th>\n<th>Trade-off<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>Single-root<\/strong><\/td>\n<td>One root CA issues directly or anchors trust.<\/td>\n<td>Simple, root is very important.<\/td>\n<\/tr>\n<tr>\n<td><strong>Hierarchical<\/strong><\/td>\n<td>Root CA signs subordinate/intermediate CAs; they sign leaf certificates.<\/td>\n<td>Delegation and scalability.<\/td>\n<\/tr>\n<tr>\n<td><strong>Cross-certified<\/strong><\/td>\n<td>Different CAs create a trust link by certifying each other.<\/td>\n<td>Trust can connect independent hierarchies, but is more complex.<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>Single-root<\/strong>, <strong>cross-certified<\/strong>, and <strong>hierarchical<\/strong> topologies are shown in the lecture diagram (PKI slide 4).<\/p>\n<p><strong>Source:<\/strong> PKI, slide 4.<\/p>\n<h2>Certificate lifecycle and revocation<\/h2>\n<div class=\"diagram-flow\"><span>Generate keys<\/span><b>→<\/b><span>Request + verify identity<\/span><b>→<\/b><span>CA signs certificate<\/span><b>→<\/b><span>Use / validate<\/span><b>→<\/b><span>Renew or revoke<\/span><\/div>\n<p><strong>Revocation<\/strong> means declaring a previously issued certificate no longer trusted before its normal expiry, for example if the private key is stolen. You may encounter <strong>CRLs<\/strong> (Certificate Revocation Lists) and <strong>OCSP<\/strong> (Online Certificate Status Protocol) in wider PKI discussions.<\/p>\n<p><strong>TLS vs SSL:<\/strong> the lecture uses the older term SSL. Modern web secure connections use <strong>TLS<\/strong>. A certificate helps authenticate the endpoint, while TLS negotiates keys and protects traffic.<\/p>\n<p><strong>Source:<\/strong> PKI, slides 2, 6, 12. CRL/OCSP and TLS terminology are extra context.<\/p>\n<h2>Advantages, limitations and legacy certificate classes<\/h2>\n<p><strong>Advantages:<\/strong> standardized technology, scalable trust delegation, choice of trust provider, and the ability to authenticate to a server without having a pre-established shared secret with it. A CA does <strong>not<\/strong> have to participate in every completed TLS connection.<\/p>\n<p><strong>Limitations:<\/strong> certificate/key handling can fail, a trusted CA can make mistakes, names and trust stores need checking, and expired or revoked certificates can interrupt service.<\/p>\n<p><strong>Legacy detail from the slides:<\/strong> PKI slide 11 lists certificate &quot;classes&quot; 0–5, ranging from test certificates to higher-assurance business/government uses. <strong>These classes are a historical classification, not a universal classification of modern browser TLS certificates.<\/strong> For current web certificates, focus on issuer validation and certificate policy rather than assuming class numbers are universal.<\/p>\n<p><strong>Source:<\/strong> PKI, slides 7, 11–12.<\/p>\n"},{"num":"09","slug":"hashes","title":"Cryptographic hashes and HMAC","short":"Hash functions and HMAC","category":"Cryptography","description":"Digest properties, collisions, MD5, SHA family, authentication and HMAC.","sections":5,"minutes":4,"html":"<blockquote>\n<p><strong>Core idea<\/strong> · Hashing compresses an arbitrarily long input into a fixed-size digest. It helps detect changes, but <strong>a plain hash cannot by itself prove who sent a message<\/strong>.<\/p>\n<\/blockquote>\n<h2>Hashing is not encryption<\/h2>\n<p>A hash function maps data <code>x<\/code> to a fixed-length value <code>h<\/code>:<\/p>\n<div class=\"formula\">h = H(x)<\/div>\n<div class=\"diagram-flow\"><span>Document / message<\/span><b>→<\/b><span>Cryptographic hash<\/span><b>→<\/b><span>Fixed-size digest<\/span><\/div>\n<p><strong>Unlike encryption<\/strong>, hashing has no decryption key and no intended inverse operation. Two files of completely different length can both produce 256-bit SHA-256 digests. A <strong>digest<\/strong> is also called a hash value or digital fingerprint.<\/p>\n<p><strong>Source:<\/strong> Hash functions, slides 2–4, 7–8.<\/p>\n<h2>What makes a good cryptographic hash?<\/h2>\n<table>\n<thead>\n<tr>\n<th>Property<\/th>\n<th>Meaning<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>Deterministic<\/strong><\/td>\n<td>Same input always gives the same output.<\/td>\n<\/tr>\n<tr>\n<td><strong>Fixed-size output<\/strong><\/td>\n<td>Digest length is fixed for a selected algorithm.<\/td>\n<\/tr>\n<tr>\n<td><strong>Preimage resistance<\/strong><\/td>\n<td>Given digest h, it is hard to find an input x with H(x)=h.<\/td>\n<\/tr>\n<tr>\n<td><strong>Second-preimage resistance<\/strong><\/td>\n<td>Given one input x, hard to find a different y with the same digest.<\/td>\n<\/tr>\n<tr>\n<td><strong>Collision resistance<\/strong><\/td>\n<td>Hard to find <strong>any two<\/strong> different inputs with the same digest.<\/td>\n<\/tr>\n<tr>\n<td><strong>Avalanche effect<\/strong><\/td>\n<td>Small input changes usually produce very different outputs.<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<blockquote>\n<p><strong>Important mathematical correction<\/strong> · Two different inputs <strong>can<\/strong> have the same hash. In fact, collisions must exist because infinitely many possible inputs map to finitely many digest values. Good cryptographic hashes make it <strong>computationally hard to find collisions<\/strong>; they cannot make collisions impossible.<\/p>\n<\/blockquote>\n<p><strong>Hash vs checksum:<\/strong> simple checksums and CRCs detect many accidental errors, but attackers can deliberately create matching checksums. Cryptographic hashes are designed to resist adversarial manipulation.<\/p>\n<p><strong>Source:<\/strong> Hash functions, slides 5–7. Collision distinction is added clarification.<\/p>\n<h2>MD5, SHA-1 and SHA-2<\/h2>\n<table>\n<thead>\n<tr>\n<th>Function<\/th>\n<th style=\"text-align:right\">Output size<\/th>\n<th>Security status for new designs<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>MD5<\/strong><\/td>\n<td style=\"text-align:right\">128 bits<\/td>\n<td>Broken for collision resistance; legacy only.<\/td>\n<\/tr>\n<tr>\n<td><strong>SHA-1<\/strong><\/td>\n<td style=\"text-align:right\">160 bits<\/td>\n<td>Collision attacks demonstrated; legacy.<\/td>\n<\/tr>\n<tr>\n<td><strong>SHA-224<\/strong><\/td>\n<td style=\"text-align:right\">224 bits<\/td>\n<td>Member of SHA-2 family.<\/td>\n<\/tr>\n<tr>\n<td><strong>SHA-256<\/strong><\/td>\n<td style=\"text-align:right\">256 bits<\/td>\n<td>Widely used SHA-2 variant.<\/td>\n<\/tr>\n<tr>\n<td><strong>SHA-384<\/strong><\/td>\n<td style=\"text-align:right\">384 bits<\/td>\n<td>SHA-2 variant.<\/td>\n<\/tr>\n<tr>\n<td><strong>SHA-512<\/strong><\/td>\n<td style=\"text-align:right\">512 bits<\/td>\n<td>SHA-2 variant.<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>Why stronger than a basic checksum?<\/strong> A deliberately altered message can often be designed to keep a simple checksum unchanged. Cryptographic hashes are built to make such targeted matching difficult.<\/p>\n<p><strong>Birthday effect:<\/strong> for an ideal n-bit hash, a collision can typically be found with about <strong>2<sup>n/2<\/sup><\/strong> trials, not 2<sup>n<\/sup>. For SHA-256, that's roughly 2<sup>128<\/sup> work for generic collisions. This explains why output length matters.<\/p>\n<p><strong>Source:<\/strong> Hash functions, slides 9–12. Birthday reasoning is extra explanation.<\/p>\n<h2>What plain hashing does and does not prove<\/h2>\n<p>Suppose someone publishes a file and a SHA-256 digest on the <strong>same attacker-controlled site<\/strong>. An attacker could replace <strong>both<\/strong> file and digest. A matching digest then does not prove the file came from the claimed owner.<\/p>\n<p>A hash is useful when the <em>expected<\/em> digest is obtained from a <strong>trusted source<\/strong>. For authenticating a sender, use a <strong>MAC<\/strong> or a <strong>digital signature<\/strong>.<\/p>\n<p><strong>Source:<\/strong> Hash functions, slides 2–7, 13–14. Trust interpretation is extra explanation.<\/p>\n<h2>HMAC — keyed message authentication code<\/h2>\n<p><strong>HMAC<\/strong> combines a cryptographic hash with a secret key and message. Only someone holding that secret can calculate the correct tag for a new message, assuming a secure scheme and protected key.<\/p>\n<div class=\"diagram-flow\"><span>Message + shared secret<\/span><b>→<\/b><span>HMAC algorithm<\/span><b>→<\/b><span>Authentication tag<\/span><\/div>\n<table>\n<thead>\n<tr>\n<th>Mechanism<\/th>\n<th>Integrity<\/th>\n<th>Sender authentication<\/th>\n<th>Secrecy<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>Plain hash<\/strong><\/td>\n<td>Detects differences <strong>if trusted expected hash exists<\/strong><\/td>\n<td>No<\/td>\n<td>No<\/td>\n<\/tr>\n<tr>\n<td><strong>HMAC<\/strong><\/td>\n<td>Yes, when verified correctly<\/td>\n<td><strong>Shared-key<\/strong> authentication<\/td>\n<td>No<\/td>\n<\/tr>\n<tr>\n<td><strong>Digital signature<\/strong><\/td>\n<td>Yes, when verified correctly<\/td>\n<td>Public-key signature authentication<\/td>\n<td>No<\/td>\n<\/tr>\n<tr>\n<td><strong>Authenticated encryption<\/strong><\/td>\n<td>Yes<\/td>\n<td>Key-holder authentication<\/td>\n<td><strong>Yes<\/strong><\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>HMAC vs signature:<\/strong> HMAC uses a <strong>shared secret<\/strong>; either party could create the same tag. A digital signature uses a <strong>private signing key<\/strong> and can be checked using the corresponding public key.<\/p>\n<blockquote>\n<p><strong>Practical detail<\/strong> · For passwords, use a <strong>purpose-built password hashing/KDF scheme<\/strong> such as Argon2id, scrypt, or bcrypt with salts and appropriate settings. Fast SHA-256 alone is not a good password-storage design.<\/p>\n<\/blockquote>\n<p><strong>Source:<\/strong> Hash functions, slides 13–14; password storage detail is extra context.<\/p>\n"},{"num":"10","slug":"risk","title":"Information security risk management","short":"Risk management","category":"Management & response","description":"Identify and prioritize risks, treatments, ISO frameworks, assessments and protective controls.","sections":7,"minutes":5,"html":"<blockquote>\n<p><strong>Core idea<\/strong> · You cannot remove every risk. Risk management helps a team decide <strong>what matters most<\/strong>, <strong>what might go wrong<\/strong>, and <strong>which actions are worth taking<\/strong>.<\/p>\n<\/blockquote>\n<h2>Threat, vulnerability, consequence and risk<\/h2>\n<p>The lecture offers this simplified model:<\/p>\n<div class=\"formula\">Risk ≈ Threat × Vulnerability × Consequence<\/div>\n<ul>\n<li><strong>Threat<\/strong>: possible source of harm, such as a criminal targeting accounts.<\/li>\n<li><strong>Vulnerability<\/strong>: weakness that could allow harm, such as weak passwords.<\/li>\n<li><strong>Consequence / impact<\/strong>: harm if it happens, such as downtime or data exposure.<\/li>\n<li><strong>Risk<\/strong>: possibility and significance of that harmful outcome.<\/li>\n<\/ul>\n<blockquote>\n<p><strong>Formula explanation<\/strong> · The slide's multiplication is a <strong>teaching model<\/strong>, not a universal exact equation. Organizations often use <strong>likelihood × impact<\/strong> on a defined scoring scale. You cannot multiply the words “hacker” and “weak password” to get a numeric risk without first assigning meaningful values.<\/p>\n<\/blockquote>\n<p><strong>IT risks<\/strong> in the slides are grouped into <strong>security<\/strong>, <strong>availability<\/strong>, <strong>performance<\/strong>, and <strong>compliance<\/strong>. The course also mentions <strong>GDPR<\/strong> (EU General Data Protection Regulation), which concerns personal data, lawful processing, data minimization, transparency, security, and individual rights.<\/p>\n<p><strong>Source:<\/strong> Risk management, slides 2–10.<\/p>\n<h2>Four treatments for risk<\/h2>\n<div class=\"four-grid\"><div class=\"mini-tile\"><strong>Avoid<\/strong><span>Stop the risky activity.<\/span><\/div><div class=\"mini-tile\"><strong>Mitigate<\/strong><span>Reduce likelihood or impact.<\/span><\/div><div class=\"mini-tile\"><strong>Transfer / share<\/strong><span>Shift some financial effect or responsibility.<\/span><\/div><div class=\"mini-tile\"><strong>Accept<\/strong><span>Keep the risk knowingly.<\/span><\/div><\/div>\n<table>\n<thead>\n<tr>\n<th>Treatment<\/th>\n<th>Example<\/th>\n<th>What it actually changes<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>Avoid<\/strong><\/td>\n<td>Stop using an unsafe service.<\/td>\n<td>Removes the exposure from that activity.<\/td>\n<\/tr>\n<tr>\n<td><strong>Mitigate<\/strong><\/td>\n<td>Add MFA, backups, access rules.<\/td>\n<td>Lowers chance or impact.<\/td>\n<\/tr>\n<tr>\n<td><strong>Transfer / share<\/strong><\/td>\n<td>Buy cyber insurance or outsource a service with contracts.<\/td>\n<td>Shifts <strong>some<\/strong> costs; organization still has responsibilities.<\/td>\n<\/tr>\n<tr>\n<td><strong>Accept<\/strong><\/td>\n<td>Management signs off on a low-severity risk.<\/td>\n<td>Leaves known <strong>residual risk<\/strong>.<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>Residual risk<\/strong> is what remains after controls. Even with MFA, account compromise is still possible through other routes. <strong>Inherent risk<\/strong> is assessed before adding the selected controls.<\/p>\n<p><strong>Source:<\/strong> Risk management, slides 11–14.<\/p>\n<h2>Risk-management cycle<\/h2>\n<div class=\"step-stack\"><div><em>1<\/em><span><strong>Identify assets:<\/strong> what data, systems and business processes matter?<\/span><\/div><div><em>2<\/em><span><strong>Find threats and weaknesses:<\/strong> what could go wrong?<\/span><\/div><div><em>3<\/em><span><strong>Assess and prioritize:<\/strong> how likely and how harmful?<\/span><\/div><div><em>4<\/em><span><strong>Choose treatment:<\/strong> avoid, mitigate, transfer/share, or accept.<\/span><\/div><div><em>5<\/em><span><strong>Implement controls:<\/strong> assign owner, budget and deadline.<\/span><\/div><div><em>6<\/em><span><strong>Monitor residual risk and review:<\/strong> is the plan working?<\/span><\/div><\/div>\n<p><strong>University example from the slides:<\/strong> protect the student database. Identify unauthorized access as a risk, prioritize it because of sensitive student records, choose MFA and access rules, implement controls for database administrators, then continue monitoring.<\/p>\n<p><strong>Risk assessment is not the whole of risk management.<\/strong> Assessment identifies and analyzes risk; management includes deciding, treating, communicating, tracking and reviewing it. Reassess periodically and when major changes occur; the lecture emphasizes that assessment is ongoing rather than one-off.<\/p>\n<p><strong>Source:<\/strong> Risk management, slides 13–14, 21–27.<\/p>\n<h2>Identifying information assets<\/h2>\n<p>An <strong>information asset<\/strong> is a meaningful collection that needs protection. A <strong>contacts database<\/strong> may be treated as one asset rather than one asset per contact row. Documents, emails and files related to one project may also form one asset. But a large content-management system containing many unrelated information sets should not automatically be treated as one asset just because they share a platform.<\/p>\n<p>Typical risk assessment scope from the governance slides: <strong>facilities and backup power<\/strong>, <strong>network inventory and scanning<\/strong>, <strong>server OS and backups<\/strong>, <strong>sensitive data classification<\/strong>, <strong>access control<\/strong>, <strong>policy and continuity plans<\/strong>, and <strong>application inventory / security review<\/strong>.<\/p>\n<p><strong>Source:<\/strong> Risk management, slide 19; organizational security, slides 9–11.<\/p>\n<h2>Risk assessments: benefits and limitations<\/h2>\n<p>A security risk assessment helps describe threats, weaknesses, impact and control choices. It gives decision-makers a reason to prioritize investment.<\/p>\n<p><strong>Benefits<\/strong> from the slides: understand the organization's risk profile, find weaknesses, inventory IT/data assets, support legal or regulatory requirements, and prioritize security spending.<\/p>\n<p><strong>
